let cloudBaseline=null, cloudSyncing=false, cloudBlocked=false, cloudGeneration=0;
const PENDING_SYNC_PREFIX='mini4wd-pending-sync-';
const pendingKey=()=>PENDING_SYNC_PREFIX+(activeGarageUser||'anonymous');
const snapshot=o=>JSON.stringify(o);
const hasGarageContent=o=>!!(o?.cars?.length||o?.events?.length||o?.components?.length||o?.batteryCells?.length||o?.batteryPairs?.length);
function normalizeGarage(o){if(!o||!Array.isArray(o.cars)||!Array.isArray(o.events)||!Array.isArray(o.categories))throw Error('Salvataggio Cloud non valido');
 return {...o,components:Array.isArray(o.components)?o.components:[],batteryCells:Array.isArray(o.batteryCells)?o.batteryCells:[],batteryPairs:Array.isArray(o.batteryPairs)?o.batteryPairs:[]}}

async function autoCloudStart(){

 const generation=++cloudGeneration,uid=cloudSession.user.id;cloudSyncing=true;cloudReady=false;cloudBlocked=false;
 cloudSyncState('☁️ Recupero del tuo garage…');
 try{
  const rows=await cloudRead();if(generation!==cloudGeneration||uid!==cloudSession?.user?.id)return;
  if(rows?.length){const remote=normalizeGarage(rows[0].payload);
    if(localStorage.getItem(pendingKey())==='1'&&snapshot(data)!==snapshot(remote)){cloudBlocked=true;cloudReady=false;cloudSyncState('⚠️ Modifiche locali non sincronizzate: dati protetti. Esporta un backup prima di procedere.');return;}
    if(snapshot(data)===snapshot(remote))localStorage.removeItem(pendingKey());
   if(snapshot(data)!==snapshot(remote)&&hasGarageContent(data))safetyBackup('prima-sincronizzazione-automatica');
   data=remote;localStorage.setItem(ACCOUNT_LOCAL_PREFIX+uid,snapshot(data));
   cloudBaseline=snapshot(remote);cloudReady=true;cloudSyncState('✓ Garage sincronizzato');render();
  }else if(hasGarageContent(data)){
   cloudBlocked=true;cloudSyncState('⚠️ Nessun garage online. Dati locali conservati: usa le opzioni avanzate per il primo caricamento.');
  }else{cloudBaseline=null;cloudReady=true;cloudSyncState('✓ Garage nuovo pronto: salvataggio automatico attivo');render()}
 }catch(e){cloudBlocked=true;cloudSyncState('⚠️ Sincronizzazione non riuscita: '+e.message+' · Dati locali conservati')}
 finally{cloudSyncing=false}
}
async function cloudWrite(){
 if(!cloudSession||!cloudConfig.url||!cloudReady||cloudBlocked||activeGarageUser!==cloudSession.user.id)return;
 if(cloudSyncing){cloudDirty=true;return}
 const uid=cloudSession.user.id,generation=cloudGeneration;
 cloudSyncing=true;cloudSyncState('☁️ Salvataggio in corso…');
 try{
  const rows=await cloudRead();if(generation!==cloudGeneration||uid!==cloudSession?.user?.id)return;
  const remote=rows?.length?normalizeGarage(rows[0].payload):null;
  if(snapshot(remote)!==snapshot(cloudBaseline===null?null:JSON.parse(cloudBaseline))){
   cloudBlocked=true;cloudReady=false;safetyBackup('conflitto-cloud');
   cloudSyncState('⚠️ Modifiche da un altro dispositivo. Salvataggio bloccato per proteggere i dati. Backup scaricato.');return;
  }
  const payload=JSON.parse(snapshot(data));
  await cloudAuthRequest('/rest/v1/garage_state?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,payload})});
  if(generation!==cloudGeneration||uid!==cloudSession?.user?.id)return;
  cloudBaseline=snapshot(payload);if(snapshot(data)===cloudBaseline)localStorage.removeItem(pendingKey());cloudSyncState('✓ Garage sincronizzato');
  if(snapshot(data)!==cloudBaseline){cloudDirty=true;setTimeout(()=>scheduleCloudSave(),1000)}
 }catch(e){cloudBlocked=true;cloudReady=false;cloudSyncState('⚠️ Salvataggio non riuscito: '+e.message+' · Dati locali conservati')}
 finally{cloudSyncing=false;if(cloudDirty&&cloudReady&&!cloudBlocked){cloudDirty=false;scheduleCloudSave()}}
}
function scheduleCloudSave(){if(!cloudReady||!cloudSession||cloudBlocked)return;cloudDirty=true;clearTimeout(cloudTimer);cloudSyncState('● Modifiche da sincronizzare…');cloudTimer=setTimeout(()=>{if(cloudSyncing){cloudDirty=true;return;}cloudDirty=false;cloudWrite()},1200)}
function safetyBackup(label){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mini4wd-garage-'+label+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}

async function cloudDownload(){

  cloudBaseline=snapshot(data);localStorage.removeItem(pendingKey());cloudBlocked=false;cloudReady=true;
  go('garage');
  cloudStatus='Garage scaricato dal cloud ✓ · Backup locale precedente scaricato';

 }catch(e){cloudMessage('Errore: '+e.message)}finally{cloudBusy=false}
}

   const previous=data.cars.find(x=>x.id===part.assignedCarId);

function batterySave(){const code=$('bc-code').value.trim(),name=($('bc-preset').value==='__other__'?$('bc-name').value:$('bc-preset').value).trim(),notes=$('bc-notes').value.trim();if(!code)return alert('Codice non disponibile');if(data.batteryCells.some(x=>x.id!==batteryEdit&&x.code.toLowerCase()===code.toLowerCase()))return alert('Codice già usato');const chemistry=$('bc-chem').value,nominalVoltage=$('bc-nom').value===''?null:Number($('bc-nom').value),nominalCapacity=$('bc-ncap').value===''?null:Number($('bc-ncap').value);if([nominalVoltage,nominalCapacity].some(v=>v!==null&&(!Number.isFinite(v)||v<=0)))return alert('Controlla i valori nominali');const c=batteryById(batteryEdit);if(c)Object.assign(c,{code,name,notes,chemistry,nominalVoltage,nominalCapacity});else{const val=k=>{const raw=$(k).value.trim();return raw===''?null:Number(raw)};const cap=val('bc-cap'),ir=val('bc-ir'),voltage=val('bc-voltage');if([cap,ir,voltage].some(v=>v!==null&&(!Number.isFinite(v)||v<0)))return alert('Controlla le misurazioni: inserisci numeri non negativi.');const mnotes=$('bc-mnotes').value.trim();const measurements=[];if(cap!==null||ir!==null||voltage!==null||mnotes){const value=[cap!==null?cap+' mAh':'',ir!==null?'IR '+ir+' mΩ':'',voltage!==null?voltage+' V':''].filter(Boolean).join(' · ')||'Misurazione iniziale';measurements.push({id:id(),date:$('bc-mdate').value||today(),cap,ir,voltage,charge:null,discharge:null,duration:null,cycles:null,session:'Misurazione',notes:mnotes,value})}data.batteryCells.push({id:id(),code,name,notes,chemistry,nominalVoltage,nominalCapacity,measurements,createdAt:today()})}batteryEdit=null;persist();render()}

function batteryMeasureSave(){const c=batteryById(batteryMeasure);if(!c)return;const num=k=>{const v=$(k).value.trim();return v===''?null:Number(v)};const cap=num('bm-cap'),ir=num('bm-ir');const measuredVoltage=num('bm-measured'),ma=num('bm-discharge-ma'),instrument=$('bm-tool').value.trim();const advanced=[batteryNumber('bm-charge'),ma===null?null:ma/1000,...['bm-voltage','bm-duration','bm-cycles'].map(batteryNumber)];if([cap,ir,measuredVoltage,...advanced].some(v=>v!==null&&(!Number.isFinite(v)||v<0)))return alert('Controlla i valori: devono essere numeri non negativi.');const [charge,discharge,voltage,duration,cycles]=advanced;const session=$('bm-type').value;const value=[cap!==null?cap+' mAh':'',ir!==null?'IR '+ir+' mΩ':'',session].filter(Boolean).join(' · ')||'Sessione registrata';c.measurements=c.measurements||[];c.measurements.push({id:id(),date:$('bm-date').value||today(),cap,ir,charge,discharge,voltage,measuredVoltage,instrument,duration,cycles,session,notes:$('bm-notes').value.trim(),value});data.batteryPrefs893={instrument,discharge:ma};batteryMeasure=null;persist();render()}

function batteryLab(){batteryInit();if(batteryMeasure)return batteryMeasureForm();if(batteryEdit)return batteryForm();if(batteryPairEdit)return batteryPairForm();const pairs=batteryScreen==='pairs';return `<h2>🔋 Battery Lab</h2><p class="muted">Batterie singole, coppie modificabili e misurazioni personali. Tutto privato.</p><div class="actions"><button class="${pairs?'secondary':''}" onclick="batteryScreen='list';render()">Batterie singole</button><button class="${pairs?'':'secondary'}" onclick="batteryScreen='pairs';render()">Le mie coppie</button></div>${pairs?`<button onclick="batteryPairEdit='new';render()">+ Crea coppia</button><div class="spacer"></div>${data.batteryPairs.length?data.batteryPairs.map(p=>`<div class="section"><strong>${esc(p.name)}</strong><p class="muted">${esc(batteryById(p.a)?.code||'Batteria mancante')} + ${esc(batteryById(p.b)?.code||'Batteria mancante')}</p><p class="muted">${p.assignedCarId?('Su '+esc(data.cars.find(x=>x.id===p.assignedCarId)?.name||'macchina')):'Disponibile'} · Abbinamenti precedenti: ${(p.history||[]).length}</p><button class="secondary" onclick="batteryPairEdit='${p.id}';render()">Cambia abbinamento</button></div>`).join(''):'<div class="empty">Nessuna coppia creata.</div>'}`:`<button onclick="batteryEdit='new';render()">+ Aggiungi batteria</button><div class="spacer"></div>${data.batteryCells.length?data.batteryCells.map(c=>{const last=c.measurements?.slice(-1)[0];return `<div class="section"><strong>🔋 ${esc(c.code)} · ${esc(c.name)}</strong><p class="muted">${esc(c.notes||'')} · ${c.measurements.length} registrazioni · Privato</p>${last?`<div class="item"><span>Ultima misurazione · ${esc(last.date)}</span><strong>${esc(last.value)}</strong></div>`:''}<details><summary class="muted">Storico completo</summary>${c.measurements.slice().reverse().map(m=>`<div class="item"><span>${esc(m.date)}</span><strong>${esc(m.value)}</strong></div>${m.notes?`<p class="muted small">${esc(m.notes)}</p>`:''}${[m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).length?`<p class="muted small">${esc([m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).join(' · '))}</p>`:''}`).join('')||'<p class="muted">Nessuna misurazione.</p>'}</details><div class="actions"><button class="secondary" onclick="batteryMeasure='${c.id}';render()">+ Misurazione</button><button class="secondary" onclick="batteryEdit='${c.id}';render()">Modifica</button></div></div>`}).join(''):'<div class="empty">Aggiungi la prima batteria singola.</div>'}`}`}

// Beta 1.8.6 — Battery Lab: trend charts and safe measurement management.
function labTrend186(ms,key,unit,color){
 const points=(key==='cap'?batteryComparable893(ms):(ms||[])).filter(m=>m[key]!==null&&m[key]!==undefined&&Number.isFinite(Number(m[key]))).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 if(points.length<2)return `<p class="muted small">Servono almeno due misurazioni di ${key==='cap'?'capacità':'resistenza interna'} per il grafico.</p>`;
 const vals=points.map(m=>Number(m[key])),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
 const coords=vals.map((v,i)=>[(30+i*290/(vals.length-1)).toFixed(1),(96-(v-min)*68/span).toFixed(1)]);
 const poly=coords.map(p=>p.join(',')).join(' ');
 const circles=coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="${color}"><title>${esc(points[i].date)}: ${vals[i]} ${unit}</title></circle>`).join('');
 return `<div class="lab-trend"><div class="lab-trend-head"><strong>${key==='cap'?'Capacità':'Resistenza interna'}</strong><span>${vals[0]} → ${vals.at(-1)} ${unit}</span></div><svg viewBox="0 0 350 125" role="img" aria-label="Andamento ${key==='cap'?'capacità':'resistenza interna'} da ${esc(points[0].date)} a ${esc(points.at(-1).date)}" style="width:100%;height:auto;display:block"><line x1="30" y1="96" x2="320" y2="96" stroke="#52616a"/><line x1="30" y1="28" x2="320" y2="28" stroke="#344049" stroke-dasharray="4 5"/><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${circles}<text x="30" y="117" fill="#aab6bf" font-size="10">${esc(points[0].date)}</text><text x="320" y="117" text-anchor="end" fill="#aab6bf" font-size="10">${esc(points.at(-1).date)}</text></svg></div>`;
}

  const history=`<details class="lab-records"><summary>📋 Gestisci misurazioni (${ms.length})</summary>${ms.length?ms.slice().reverse().map(m=>`<div class="lab-record"><span>${esc(m.date)} · ${esc(m.value||'Misurazione')}${m.measuredVoltage!=null?' · '+esc(m.measuredVoltage)+' V':''}${m.discharge!=null?' · '+esc(Math.round(m.discharge*1000))+' mA':''}${m.instrument?' · '+esc(m.instrument):''}${m.notes?' · '+esc(m.notes):''}</span><button class="secondary" onclick="labDeleteMeasure186('${c.id}','${m.id}')">Elimina</button></div>`).join(''):'<p class="muted">Nessuna misurazione.</p>'}</details>`;
  const marker=`<div class="ui-eyebrow">${esc(c.code)}</div>`;
  const pos=html.indexOf(marker);if(pos<0)continue;
  const next=html.indexOf('<div class="ui-battery-card">',pos+marker.length);

async function galleryResize186(file){

 return new Promise((resolve,reject)=>{
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{try{const scale=Math.min(1,680/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 const out=canvas.toDataURL('image/jpeg',.58);URL.revokeObjectURL(url);
 if(out.length>145000)throw Error('Immagine troppo pesante dopo la compressione.');
 resolve(out)}catch(e){URL.revokeObjectURL(url);reject(e)}};
 img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Formato non leggibile su questo dispositivo. Prova a esportare in JPEG.'))};

 });

const PHOTO_BUCKET186='mini4wd-photos';
const photoSigned186=new Map();
function photoPath186(p){return typeof p==='string'&&p.startsWith('storage:')?p.slice(8):null}
function photoUrl186(p){const path=photoPath186(p);return path?(photoSigned186.get(path)||''):p}
async function photoRequest186(path,opts={}){
 const make=()=>({method:opts.method||'GET',headers:{apikey:cloudConfig.key,Authorization:'Bearer '+cloudSession.access_token,...(opts.headers||{})},body:opts.body});
 let r=await fetch(cloudUrl(path),make());
 if(r.status===401){await refreshCloudToken();r=await fetch(cloudUrl(path),make())}
 const txt=await r.text();let obj;try{obj=JSON.parse(txt)}catch{obj=txt}
 if(!r.ok)throw Error(obj?.message||obj?.error||'HTTP '+r.status);
 return obj;
}
async function signedPhoto186(path){
 if(photoSigned186.has(path))return photoSigned186.get(path);
 const obj=await photoRequest186('/storage/v1/object/sign/'+PHOTO_BUCKET186+'/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
 const signed=obj?.signedURL||obj?.signedUrl;
 if(!signed)throw Error('URL firmato non disponibile');
 const url=signed.startsWith('http')?signed:cloudUrl(signed.startsWith('/storage/')?signed:'/storage/v1'+signed);
 photoSigned186.set(path,url);setTimeout(()=>photoSigned186.delete(path),3000000);return url;
}

 return `<details class="pair-tech186"><summary>⚙️ Dati tecnici avanzati (facoltativi)</summary><div class="pair-tech-body"><div class="pair-tech-line"><strong>Confronto celle</strong><div>Differenza capacità: <strong>${diff('cap','mAh')}</strong> · Differenza resistenza: <strong>${diff('ir','mΩ')}</strong></div><small>Confronto indicativo delle ultime misurazioni, non un giudizio sulla qualità della coppia.</small></div>${row(a,ma,'A')}${row(b,mb,'B')}<small>Per aggiungere carica, scarica, cicli e altri dati, apri la singola cella e seleziona + Misurazione. Tutti i valori sono facoltativi.</small></div></details>`;
}
</script>

</style><script>
// Motor Lab 1.8.7: prototipo isolato, senza sincronizzazione e senza modificare il Garage reale.
let motor187View='list',motor187Id=null,motor187EntryType='measure',motor187EditEntry=null;
const motor187Motors=()=>{if(!Array.isArray(data.components))data.components=[];return data.components.filter(x=>x.kind==='motor')};
const motor187ById=()=>motor187Motors().find(x=>x.id===motor187Id);
const motor187Entries=m=>(m.measurements||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
const motor187Num=(v,d=0)=>v==null||v===''?'—':Number(v).toLocaleString('it-IT',{maximumFractionDigits:d});
function motor88RPM(value){const n=value===''||value==null?28000:Number(value);return `<div class="motor88-rpm"><label for="m187-rpm">Regime motore · RPM *</label><div class="motor88-control"><button type="button" class="secondary" onclick="motor88Adjust(-100)">−</button><input id="m187-rpm" type="number" inputmode="numeric" min="20000" max="40000" step="1" value="${esc(value??'')}" placeholder="28000" oninput="motor88Sync(this.value)"><button type="button" class="secondary" onclick="motor88Adjust(100)">+</button></div><input aria-label="Seleziona RPM" id="motor88-range" type="range" min="20000" max="40000" step="100" value="${Math.max(20000,Math.min(40000,n))}" oninput="$('m187-rpm').value=this.value"><div class="motor88-limits"><span>20.000</span><span>30.000</span><span>40.000</span></div></div>`}
function motor88Sync(v){if(v!==''&&Number.isFinite(Number(v)))$('motor88-range').value=String(Math.max(20000,Math.min(40000,Number(v))))}
function motor88Adjust(delta){const el=$('m187-rpm');const n=el.value===''?28000:Number(el.value);el.value=String(Math.max(20000,Math.min(40000,n+delta)));motor88Sync(el.value)}
function motor197Numeric(label,key,value,step,precision=0){return `<div><label>${esc(label)}</label><div class="row" style="gap:6px;align-items:center"><input style="flex:1;min-width:0" id="m187-${key}" type="number" inputmode="decimal" min="0" step="${step}" value="${esc(value??'')}" placeholder="${key==='rpm'?'Es. 28000':'Es. 0.43'}"><button type="button" class="secondary" aria-label="Diminuisci ${esc(label)}" onclick="motor197Adjust('${key}',-${step},${precision})">−</button><button type="button" class="secondary" aria-label="Aumenta ${esc(label)}" onclick="motor197Adjust('${key}',${step},${precision})">+</button></div></div>`}
function motor197Adjust(key,delta,precision){const el=$('m187-'+key);if(!el)return;const current=el.value===''?0:Number(el.value);el.value=String(Math.max(0,Number((current+delta).toFixed(precision))));el.dispatchEvent(new Event('input',{bubbles:true}));}
const motor187Input=(label,key,value='',type='text',extra='')=>`<div><label>${label}</label><input id="m187-${key}" type="${type}" value="${esc(value??'')}" ${extra}></div>`;
function motor187Open(mid,view='detail'){motor187Id=mid;motor187View=view;render()}
function motor187StartEntry(mid,type,eid=null){motor187Id=mid;motor187EntryType=type;motor187EditEntry=eid;motor187View='entry';render()}
function motor187StartNew(){motor187Id=null;motor187View='edit';render()}
function motor187SaveMotor(){const v=k=>$('m187-'+k)?.value.trim()||'';const name=v('name');if(!name)return alert('Scegli un modello.');let m=motor187ById();if(!m){m={id:id(),kind:'motor',measurements:[],assignedCarId:null,createdAt:today()};data.components.push(m)}Object.assign(m,{name,code:m.code||('MOT-'+String(motor187Motors().indexOf(m)+1).padStart(3,'0')),nickname:v('nickname'),notes:v('notes'),inactive:$('m187-inactive')?.checked||false});motor187Id=m.id;persist();motor187View='detail';render()}
function motor187DeleteMotor(){const m=motor187ById();if(!m||!confirm('Eliminare il motore e tutto il suo storico? Questa azione non si può annullare.'))return;data.components=data.components.filter(x=>x.id!==m.id);motor187Id=null;motor187View='list';persist();render()}
const motor187Models=["Power Dash", "Sprint Dash", "Hyper Dash 3", "Mach Dash", "Light Dash", "Torque Tuned 2", "Rev Tuned 2", "Atomic Tuned 2", "Hyper Dash PRO", "Mach Dash PRO", "Torque Tuned 2 PRO", "Rev Tuned 2 PRO", "Atomic Tuned 2 PRO", "Light Dash PRO", "Hyper Dash 2", "Hyper Dash", "Plasma Dash", "Ultra Dash", "Touch Dash", "Normal Motor", "Altro"];
function motor187Select(label,key,values,current){return `<div><label>${label}</label><select id="m187-${key}">${values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}

const motor187Voltages=['1','1.5','2','2.5','2.8','3','3.5','4'];
const motor187Methods=['A secco','Slave motor','Con olio','Con petrolio lampante','Altro'];
const motor187Templates=()=>{if(!Array.isArray(data.motorBreakinTemplates))data.motorBreakinTemplates=[];return data.motorBreakinTemplates};
function motor187SaveTemplates(t){data.motorBreakinTemplates=t;persist()}
let motor187Steps=[];
function motor187InitSteps(e){motor187Steps=(e.steps&&e.steps.length?e.steps:[{voltage:'1.5',direction:'Orario',minutes:'5'},{voltage:'1.5',direction:'Antiorario',minutes:'5'}]).map(x=>({...x}));}
function motor187StepSelect(values,selected,attr){return `<select ${attr}>${values.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function motor187StepsHTML(){return `<div id="m187-step-list">${motor187Steps.map((st,i)=>`<div class="motor187-card" style="margin:8px 0"><div class="row"><strong>Passaggio ${i+1}</strong>${motor187Steps.length>1?`<button type="button" class="secondary" onclick="motor187RemoveStep(${i})">Elimina</button>`:''}</div><div class="motor187-fields"><div><label>Tensione</label>${motor187StepSelect([...new Set([...motor187Voltages,st.voltage].filter(Boolean))],st.voltage,`onchange="motor187Steps[${i}].voltage=this.value"`)}</div><div><label>Rotazione</label>${motor187StepSelect(['Orario','Antiorario'],st.direction,`onchange="motor187Steps[${i}].direction=this.value"`)}</div><div><label>Minuti</label>${motor187StepSelect(['1','2','3','5','10','15','20','30'],st.minutes,`onchange="motor187Steps[${i}].minutes=this.value;motor187UpdateTotal()"`)}</div></div></div>`).join('')}</div><button type="button" class="secondary" onclick="motor187AddStep()">+ Aggiungi passaggio</button><p id="m187-total" class="muted">${motor187Steps.length} passaggi · ${motor187Steps.reduce((a,x)=>a+(Number(x.minutes)||0),0)} minuti di funzionamento</p>`}
function motor187UpdateTotal(){const el=$('m187-total');if(el)el.textContent=`${motor187Steps.length} passaggi · ${motor187Steps.reduce((a,x)=>a+(Number(x.minutes)||0),0)} minuti di funzionamento`}
function motor187AddStep(){const last=motor187Steps[motor187Steps.length-1]||{voltage:'1.5',direction:'Antiorario',minutes:'5'};motor187Steps.push({voltage:last.voltage,direction:last.direction==='Orario'?'Antiorario':'Orario',minutes:'5'});$('m187-steps-wrap').innerHTML=motor187StepsHTML()}
function motor187RemoveStep(i){motor187Steps.splice(i,1);$('m187-steps-wrap').innerHTML=motor187StepsHTML()}
function motor187LoadTemplate(idx){const t=motor187Templates()[Number(idx)];if(!t)return;motor187Steps=t.steps.map(x=>({...x}));$('m187-steps-wrap').innerHTML=motor187StepsHTML();for(const [key,val] of Object.entries({method:t.method,cooling:t.cooling,product:t.product})){const el=$('m187-'+key);if(el)el.value=val||''}}
function motor187SaveTemplate(){const name=prompt('Nome del metodo da riutilizzare:');if(!name?.trim())return;const v=k=>$('m187-'+k)?.value||'';const arr=motor187Templates();arr.push({name:name.trim(),steps:motor187Steps.map(x=>({...x})),method:v('method'),cooling:v('cooling'),product:v('product')});motor187SaveTemplates(arr);const sel=$('m187-template');if(sel)sel.innerHTML='<option value="">Scegli un metodo salvato</option>'+arr.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');alert('Metodo salvato. Potrai riutilizzarlo su altri motori.')}
function motor187DuplicateBreakin(eid){const m=motor187ById();const e=m?.measurements?.find(x=>x.id===eid);if(!e)return;motor187StartEntry(m.id,'breakin');motor187Steps=(e.steps||[]).map(x=>({...x}));if(!motor187Steps.length)motor187InitSteps(e);$('m187-steps-wrap').innerHTML=motor187StepsHTML();for(const [key,val] of Object.entries({method:e.method,cooling:e.cooling,product:e.product})){const el=$('m187-'+key);if(el)el.value=val||''}}
function motor187SaveEntry(){const m=motor187ById();if(!m)return;const v=k=>$('m187-'+k)?.value.trim()||'';const date=v('date')||today(),notes=v('notes'),type=motor187EntryType;let payload={date,notes,type};if(type==='measure'){if(!v('rpm')||!Number.isInteger(Number(v('rpm')))||Number(v('rpm'))<20000||Number(v('rpm'))>40000)return alert('Inserisci un valore intero tra 20.000 e 40.000 RPM.');Object.assign(payload,{rpm:Number(v('rpm')),voltage:v('voltage')===''?null:Number(v('voltage')),amps:v('amps')===''?null:Number(v('amps')),temperature:v('temperature')===''?null:Number(v('temperature')),tool:v('tool'),value:v('rpm')+' RPM'+(v('voltage')?' · '+v('voltage')+' V':'')})}else if(type==='breakin'){const minutes=motor187Steps.reduce((a,x)=>a+(Number(x.minutes)||0),0);Object.assign(payload,{steps:motor187Steps.map(x=>({...x})),method:v('method'),cooling:v('cooling'),product:v('product'),duration:String(minutes),value:`${motor187Steps.length} passaggi · ${minutes} min · ${v('method')||'Metodo non indicato'}`})}else{if(!v('action'))return alert('Indica l’intervento.');Object.assign(payload,{action:v('action'),value:v('action')})}let e=(m.measurements||[]).find(x=>x.id===motor187EditEntry);if(!e){e={id:id()};m.measurements.push(e)}Object.assign(e,payload);persist();motor187View='detail';motor187EditEntry=null;render()}

function motor187DeleteEntry(eid){const m=motor187ById();if(!m||!confirm('Eliminare questa voce dallo storico?'))return;m.measurements=m.measurements.filter(x=>x.id!==eid);persist();render()}
function motor187Chart(m){const pts=motor187Entries(m).filter(x=>x.type==='measure'&&Number(x.rpm)>0&&Number(x.voltage)===2.8).reverse();if(pts.length<2)return '<p class="muted">Il grafico standard appare dopo almeno due misurazioni RPM a 2,8 V.</p>';const w=320,h=110,min=Math.min(...pts.map(x=>x.rpm)),max=Math.max(...pts.map(x=>x.rpm)),span=max-min||1;const coords=pts.map((x,i)=>[15+(290*i/Math.max(1,pts.length-1)),95-(x.rpm-min)/span*75]);return `<svg class="motor187-chart" viewBox="0 0 320 110" aria-label="Andamento RPM"><line x1="15" y1="95" x2="305" y2="95" stroke="#69776c"/><polyline fill="none" stroke="#b1fa55" stroke-width="3" points="${coords.map(p=>p.join(',')).join(' ')}"/>${coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#b1fa55"/>`).join('')}</svg><p class="muted">Da ${motor187Num(min)} a ${motor187Num(max)} RPM · ${pts.length} prove a 2,8 V</p>`}
function motor187Compare(firstId,secondId){const out=$('m187-comparison');if(!out)return;if(!secondId){out.innerHTML='';return}const a=motor187Motors().find(x=>x.id===firstId),b=motor187Motors().find(x=>x.id===secondId);if(!a||!b)return;const last=m=>(m.measurements||[]).filter(x=>x.type==='measure'&&Number(x.voltage)===2.8&&Number(x.rpm)>0).slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')))[0];const x=last(a),y=last(b);out.innerHTML=`<div class="motor187-card"><strong>Ultima prova a 2,8 V</strong><p>${esc(a.nickname||a.code||a.name)}: ${x?motor187Num(x.rpm)+' RPM':'Nessuna prova'}</p><p>${esc(b.nickname||b.code||b.name)}: ${y?motor187Num(y.rpm)+' RPM':'Nessuna prova'}</p>${x&&y?`<p>Differenza: ${motor187Num(Math.abs(x.rpm-y.rpm))} RPM</p>`:''}<small>Confronto indicativo: usa le stesse condizioni di prova.</small></div>`}
function motor187Page(){const m=motor187ById();const banner='';
if(motor187View==='edit'){return banner+`<button class="secondary" onclick="motor187View=motor187Id?'detail':'list';render()">← Indietro</button><h2>${m?'Modifica motore':'Nuovo motore'}</h2><div class="section"><div class="motor187-fields">${motor187Select('Modello *','name',[...new Set([...motor187Models,m?.name].filter(Boolean))],m?.name||'Power Dash')}${motor187Input('Nome per distinguerlo (facoltativo)','nickname',m?.nickname||'')}</div><label>Note (facoltative)</label><textarea id="m187-notes">${esc(m?.notes||'')}</textarea><label><input type="checkbox" id="m187-inactive" ${m?.inactive?'checked':''}> Fuori servizio</label></div><button onclick="motor187SaveMotor()">Salva motore</button>${m?'<button class="secondary" onclick="motor187DeleteMotor()">🗑 Elimina motore</button>':''}`}

if(motor187View==='entry'&&m){const e=(m.measurements||[]).find(x=>x.id===motor187EditEntry)||{};const t=motor187EntryType;if(t==='breakin')motor187InitSteps(e);return banner+`<button class="secondary" onclick="motor187View='detail';render()">← Scheda motore</button><h2>${motor187EditEntry?'Modifica':'Nuova'} ${t==='measure'?'misurazione':t==='breakin'?'sessione rodaggio':'manutenzione'}</h2><p class="muted">${esc(m.nickname||m.name)}</p><div class="section">${motor187Input('Data','date',e.date||today(),'date')}${t==='measure'?`<div class="motor187-fields">${motor88RPM(e.rpm??'')}${motor187Input('Tensione (V) · predefinita 2,8','voltage',e.voltage??2.8,'number','min="0" step="0.01"')}${motor197Numeric('Assorbimento (A) · facoltativo','amps',e.amps??'',0.01,2)}<details ${e.temperature!=null&&e.temperature!==''?'open':''}><summary>Temperatura (°C) · facoltativa</summary>${motor187Input('Temperatura (°C)','temperature',e.temperature??'','number','step="0.1"')}</details>${motor187Input('Strumento di rilevazione','tool',e.tool||'')}</div>`:t==='breakin'?`<div><label>Carica un metodo già salvato (facoltativo)</label><select id="m187-template" onchange="motor187LoadTemplate(this.value)"><option value="">Scegli un metodo salvato</option>${motor187Templates().map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select></div>${motor187Select('Metodo principale','method',motor187Methods,e.method||'A secco')}<div class="motor187-fields">${motor187Input('Prodotto / lubrificante (facoltativo)','product',e.product||'')}<div><label>Raffreddamento tra passaggi (min)</label>${motor187StepSelect(['0','1','2','3','5','10','15','20'],e.cooling??'5','id="m187-cooling"')}</div></div><div id="m187-steps-wrap">${motor187StepsHTML()}</div><button type="button" class="secondary" onclick="motor187SaveTemplate()">☆ Salva come metodo preferito</button><p class="muted">Il metodo e i passaggi sono personalizzabili. Petrolio lampante: non usare su motori alimentati o caldi; è infiammabile.</p>`:`${motor187Select('Tipo intervento','action',['Pulizia','Lubrificazione','Sostituzione spazzole','Controllo','Altro'],e.action||'Pulizia')}` }<label>Note (facoltative)</label><textarea id="m187-notes">${esc(e.notes||'')}</textarea></div><button onclick="motor187SaveEntry()">Salva nello storico</button>`}

const LANG187_NAMES={auto:'🌐 Automatico (dispositivo)',it:'🇮🇹 Italiano',en:'🇬🇧 English',ja:'🇯🇵 日本語',de:'🇩🇪 Deutsch',fr:'🇫🇷 Français'};
function lang187(){
 const pref=localStorage.getItem(LANG187_KEY)||'auto';
 const browser=(navigator.languages?.[0]||navigator.language||'it').slice(0,2).toLowerCase();
 return pref==='auto'?(I18N187[browser]?browser:'en'):(I18N187[pref]?pref:'it');
}
function setLanguage187(value){
 if(!Object.hasOwn(LANG187_NAMES,value))return;
 localStorage.setItem(LANG187_KEY,value);
 render();
}
function languageSettings187(){
 const selected=localStorage.getItem(LANG187_KEY)||'auto';
 return `<div class="section"><h3>🌐 ${I18N187[lang187()]['Lingua dell’app']}</h3><select id="language187" onchange="setLanguage187(this.value)">${Object.entries(LANG187_NAMES).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v}</option>`).join('')}</select></div>`;
}
function translateText187(str,lang){
 const dict=I18N187[lang];
 if(!dict)return str;
 const exact=dict[str.trim()];
 if(exact){const pre=str.match(/^\s*/)[0],post=str.match(/\s*$/)[0];return pre+exact+post;}
 // Translate common button prefixes without changing user-entered values.
 return str.replace(/^(←\s*|[+]\s*|[🚗🔧🏁🕘📦📰⚙️☁️🔋]\s*)(.*)$/u,(full,prefix,rest)=>dict[rest]?prefix+dict[rest]:full);
}
function translateUI187(){
 const lang=lang187();
 document.documentElement.lang=lang;
 const nodes=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const all=[];while(nodes.nextNode())all.push(nodes.currentNode);
 for(const n of all){
  if(n.parentElement?.closest('script,style,textarea,option,input,[contenteditable]'))continue;
  const next=translateText187(n.nodeValue,lang);
  if(next!==n.nodeValue)n.nodeValue=next;
 }
 // Only static placeholders; never translate user-entered values or saved data.
 for(const el of document.querySelectorAll('input[placeholder],textarea[placeholder]')){
  const p=el.getAttribute('placeholder');
  if(I18N187[lang][p])el.setAttribute('placeholder',I18N187[lang][p]);
 }
}

render=function(){

 if(page==='settings'){
  const app=document.getElementById('app');
  if(app&&!document.getElementById('language187')){

  }
 }

};

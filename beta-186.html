async function cloudDownload(){
 if(!cloudSession)return alert('Prima accedi.');
 if(activeGarageUser!==cloudSession.user.id)return alert('Profilo locale non corrispondente all’account. Esci e accedi nuovamente.');
 if(cloudBusy)return;
 cloudBusy=true;cloudMessage('Lettura dal cloud…');
 try{
  const rows=await cloudRead();
  if(!rows?.length){cloudMessage('Il cloud è vuoto. Nessun dato locale è stato modificato.');return}
  const remote=rows[0].payload;
  if(!remote||!Array.isArray(remote.cars)||!Array.isArray(remote.events)||!Array.isArray(remote.categories))throw Error('Dati online non validi');
  if(!confirm('ATTENZIONE: SCARICA DAL CLOUD sostituisce il garage di questo dispositivo, comprese le schede motori e batterie. NON unisce i dati. Vuoi continuare?')){cloudMessage('Download annullato. Dati locali invariati.');return}
  safetyBackup('prima-di-scaricare-cloud');
  if(!confirm('Ho preparato un backup locale. Controlla che sia stato scaricato. Confermi di SOSTITUIRE i dati locali con quelli online?')){cloudMessage('Download annullato. Dati locali invariati.');return}
  cloudReady=false;
  localStorage.setItem(activeGarageUser?ACCOUNT_LOCAL_PREFIX+activeGarageUser:KEY,JSON.stringify(remote));
  data=remote;
  if(!Array.isArray(data.components))data.components=[];
  if(!Array.isArray(data.batteryCells))data.batteryCells=[];
  if(!Array.isArray(data.batteryPairs))data.batteryPairs=[];
  cloudBaseline=snapshot(data);cloudBlocked=false;cloudReady=true;
  go('garage');
  cloudStatus='Garage scaricato dal cloud ✓ · Backup locale precedente scaricato';
  alert('Download completato. Il garage locale è stato sostituito. Il backup precedente è stato scaricato.');
 }catch(e){cloudMessage('Errore: '+e.message)}finally{cloudBusy=false}
}

function saveAssignments(cid){
 const c=data.cars.find(x=>x.id===cid);
 const changes=[];
 for(const kind of ['motor','battery']){
  const chosen=$('assign-'+kind).value;
  const old=currentPart(cid,kind);
  if((old?.id||'')===chosen)continue;
  if(old){old.assignedCarId=null;changes.push(compKind(kind)+': rimosso '+componentName(old))}
  if(chosen){
   const part=data.components.find(x=>x.id===chosen);
   const previous=data.cars.find(x=>x.id===part.assignedCarId);
   if(previous)changes.push(compKind(kind)+': spostato da '+previous.name);
   part.assignedCarId=cid;
   changes.push(compKind(kind)+': montato '+componentName(part));
  }
 }
 if(changes.length){
  data.events.unshift({id:id(),type:'work',carId:cid,carName:c.name,chassis:c.chassis,category:c.category,title:'Cambio componenti',date:today(),before:{...c.setup},after:{...c.setup},notes:changes.join(' | ')});

 }
 inventoryCar=null;page='garage';selected=cid;render();
}

function batteryLab(){batteryInit();if(batteryMeasure)return batteryMeasureForm();if(batteryEdit)return batteryForm();if(batteryPairEdit)return batteryPairForm();const pairs=batteryScreen==='pairs';return `<h2>🔋 Battery Lab</h2><p class="muted">Batterie singole, coppie modificabili e misurazioni personali. Tutto privato.</p><div class="actions"><button class="${pairs?'secondary':''}" onclick="batteryScreen='list';render()">Batterie singole</button><button class="${pairs?'':'secondary'}" onclick="batteryScreen='pairs';render()">Le mie coppie</button></div>${pairs?`<button onclick="batteryPairEdit='new';render()">+ Crea coppia</button><div class="spacer"></div>${data.batteryPairs.length?data.batteryPairs.map(p=>`<div class="section"><strong>${esc(p.name)}</strong><p class="muted">${esc(batteryById(p.a)?.code||'Batteria mancante')} + ${esc(batteryById(p.b)?.code||'Batteria mancante')}</p><p class="muted">${p.assignedCarId?('Su '+esc(data.cars.find(x=>x.id===p.assignedCarId)?.name||'macchina')):'Disponibile'} · Abbinamenti precedenti: ${(p.history||[]).length}</p><button class="secondary" onclick="batteryPairEdit='${p.id}';render()">Cambia abbinamento</button></div>`).join(''):'<div class="empty">Nessuna coppia creata.</div>'}`:`<button onclick="batteryEdit='new';render()">+ Aggiungi batteria</button><div class="spacer"></div>${data.batteryCells.length?data.batteryCells.map(c=>{const last=c.measurements?.slice(-1)[0];return `<div class="section"><strong>🔋 ${esc(c.code)} · ${esc(c.name)}</strong><p class="muted">${esc(c.notes||'')} · ${c.measurements.length} registrazioni · Privato</p>${last?`<div class="item"><span>Ultima misurazione · ${esc(last.date)}</span><strong>${esc(last.value)}</strong></div>`:''}<details><summary class="muted">Storico completo</summary>${c.measurements.slice().reverse().map(m=>`<div class="item"><span>${esc(m.date)}</span><strong>${esc(m.value)}</strong></div>${m.notes?`<p class="muted small">${esc(m.notes)}</p>`:''}${[m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).length?`<p class="muted small">${esc([m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).join(' · '))}</p>`:''}`).join('')||'<p class="muted">Nessuna misurazione.</p>'}</details><div class="actions"><button class="secondary" onclick="batteryMeasure='${c.id}';render()">+ Misurazione</button><button class="secondary" onclick="batteryEdit='${c.id}';render()">Modifica</button></div></div>`}).join(''):'<div class="empty">Aggiungi la prima batteria singola.</div>'}`}`}

// Beta 1.8.6 — Battery Lab: trend charts and safe measurement management.
function labTrend186(ms,key,unit,color){
 const points=(ms||[]).filter(m=>m[key]!==null&&m[key]!==undefined&&Number.isFinite(Number(m[key]))).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 if(points.length<2)return `<p class="muted small">Servono almeno due misurazioni di ${key==='cap'?'capacità':'resistenza interna'} per il grafico.</p>`;
 const vals=points.map(m=>Number(m[key])),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
 const coords=vals.map((v,i)=>[(30+i*290/(vals.length-1)).toFixed(1),(96-(v-min)*68/span).toFixed(1)]);
 const poly=coords.map(p=>p.join(',')).join(' ');
 const circles=coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="${color}"><title>${esc(points[i].date)}: ${vals[i]} ${unit}</title></circle>`).join('');
 return `<div class="lab-trend"><div class="lab-trend-head"><strong>${key==='cap'?'Capacità':'Resistenza interna'}</strong><span>${vals[0]} → ${vals.at(-1)} ${unit}</span></div><svg viewBox="0 0 350 125" role="img" aria-label="Andamento ${key==='cap'?'capacità':'resistenza interna'} da ${esc(points[0].date)} a ${esc(points.at(-1).date)}" style="width:100%;height:auto;display:block"><line x1="30" y1="96" x2="320" y2="96" stroke="#52616a"/><line x1="30" y1="28" x2="320" y2="28" stroke="#344049" stroke-dasharray="4 5"/><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>${circles}<text x="30" y="117" fill="#aab6bf" font-size="10">${esc(points[0].date)}</text><text x="320" y="117" text-anchor="end" fill="#aab6bf" font-size="10">${esc(points.at(-1).date)}</text></svg></div>`;
}
function labDeleteMeasure186(cid,mid){const c=batteryById(cid);if(!c)return;const m=(c.measurements||[]).find(x=>x.id===mid);if(!m)return;if(!confirm(`Eliminare la misurazione del ${m.date}? Questa operazione non si può annullare.`))return;c.measurements=c.measurements.filter(x=>x.id!==mid);persist();render()}
const batteryLab186Manage=batteryLab;
batteryLab=function(){let html=batteryLab186Manage();if(batteryEdit||batteryPairEdit||batteryMeasure||batteryScreen==='pairs')return html;
 for(const c of data.batteryCells||[]){const ms=(c.measurements||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const graph=`<details class="lab-charts"><summary>📈 Grafici andamento (${ms.length} misurazioni)</summary><p class="muted small">Confronti indicativi: temperatura, stato di carica e caricabatterie possono influenzare i risultati.</p>${labTrend186(ms,'cap','mAh','#b1fa55')}${labTrend186(ms,'ir','mΩ','#a8c6e5')}</details>`;
  const history=`<details class="lab-records"><summary>📋 Gestisci misurazioni (${ms.length})</summary>${ms.length?ms.slice().reverse().map(m=>`<div class="lab-record"><span>${esc(m.date)} · ${esc(m.value||'Misurazione')}</span><button class="secondary" onclick="labDeleteMeasure186('${c.id}','${m.id}')">Elimina</button></div>`).join(''):'<p class="muted">Nessuna misurazione.</p>'}</details>`;
  const marker=`<div class="ui-eyebrow">${esc(c.code)}</div>`;
  const pos=html.indexOf(marker);if(pos<0)continue;
  const next=html.indexOf('<div class="ui-battery-card">',pos+marker.length);
  const end=next>=0?next:html.indexOf('<div class="empty">',pos+marker.length);
  const chunk=html.slice(pos,end<0?html.length:end);
  const anchor='<div class="actions"><button onclick="batteryMeasure=';
  const ix=chunk.indexOf(anchor);
  if(ix>=0)html=html.slice(0,pos)+chunk.slice(0,ix)+graph+history+chunk.slice(ix)+html.slice(pos+chunk.length);
 }
 return html;
};

async function galleryResize186(file){
 if(file.size>18*1024*1024)throw Error('Foto troppo grande (massimo 18 MB).');
 return new Promise((resolve,reject)=>{
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{try{const scale=Math.min(1,680/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 const out=canvas.toDataURL('image/jpeg',.58);URL.revokeObjectURL(url);
 if(out.length>145000)throw Error('Immagine troppo pesante dopo la compressione.');
 resolve(out)}catch(e){URL.revokeObjectURL(url);reject(e)}};
 img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Formato non leggibile su questo dispositivo. Prova a esportare in JPEG.'))};
 img.src=url;
 });
}

// Beta 1.8.6 — Private Supabase Storage pilot for additional gallery photos.
// Existing data: images in data URI remain readable; migration occurs ONLY when saving a Mini.
const PHOTO_BUCKET186='mini4wd-photos';
const photoSigned186=new Map();
function photoPath186(p){return typeof p==='string'&&p.startsWith('storage:')?p.slice(8):null}
function photoUrl186(p){const path=photoPath186(p);return path?(photoSigned186.get(path)||''):p}
async function photoRequest186(path,opts={}){
 const make=()=>({method:opts.method||'GET',headers:{apikey:cloudConfig.key,Authorization:'Bearer '+cloudSession.access_token,...(opts.headers||{})},body:opts.body});
 let r=await fetch(cloudUrl(path),make());
 if(r.status===401){await refreshCloudToken();r=await fetch(cloudUrl(path),make())}
 const txt=await r.text();let obj;try{obj=JSON.parse(txt)}catch{obj=txt}
 if(!r.ok)throw Error(obj?.message||obj?.error||'HTTP '+r.status);
 return obj;
}
async function signedPhoto186(path){
 if(photoSigned186.has(path))return photoSigned186.get(path);
 const obj=await photoRequest186('/storage/v1/object/sign/'+PHOTO_BUCKET186+'/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
 const signed=obj?.signedURL||obj?.signedUrl;
 if(!signed)throw Error('URL firmato non disponibile');
 const url=signed.startsWith('http')?signed:cloudUrl(signed.startsWith('/storage/')?signed:'/storage/v1'+signed);
 photoSigned186.set(path,url);setTimeout(()=>photoSigned186.delete(path),3000000);return url;
}

 });
}

// Beta 1.8.6 — rotazione reale delle fotografie aggiuntive (JPEG, 90°).
async function rotateGallery186(i,dir){
 if(!form||savingPhotos186)return;
 const entry=galleryPhotos186(form)[i];if(!entry)return;
 try{
  const src=photoPath186(entry)?await signedPhoto186(photoPath186(entry)):entry;
  const picture=new Image();picture.crossOrigin='anonymous';
  await new Promise((ok,no)=>{picture.onload=ok;picture.onerror=()=>no(Error('Impossibile leggere la foto'));picture.src=src});
  const w=picture.naturalWidth,h=picture.naturalHeight;
  const canvas=document.createElement('canvas');canvas.width=h;canvas.height=w;
  const ctx=canvas.getContext('2d');
  if(dir>0){ctx.translate(h,0);ctx.rotate(Math.PI/2)}else{ctx.translate(0,w);ctx.rotate(-Math.PI/2)}
  ctx.drawImage(picture,0,0);
  const result=canvas.toDataURL('image/jpeg',.82);
  const next=galleryPhotos186(form).slice();next[i]=result;form.gallery186=next;
  render();
 }catch(e){alert('Rotazione non riuscita: '+e.message)}
}

<script>
// Display-only enhancement: no changes to saved battery data or sync.
function compactBatteryRows186(){
 if(typeof page==='undefined'||page!=='battery'||batteryScreen==='pairs'||batteryEdit||batteryMeasure||batteryPairEdit)return;
 document.querySelectorAll('.ui-battery-card:not([data-folded])').forEach(card=>{
  card.dataset.folded='1';
  const head=card.querySelector('.ui-battery-head');
  const code=head?.querySelector('.ui-eyebrow')?.textContent?.trim()||'Batteria';
  const name=head?.querySelector('h3')?.textContent?.trim()||'Batteria';
  const metrics=card.querySelectorAll('.ui-metric strong');
  const cap=metrics[0]?.textContent?.trim()||'—';
  const ir=metrics[1]?.textContent?.trim()||'—';
  const fold=document.createElement('details');fold.className='battery-fold186';
  const summary=document.createElement('summary');
  const id=document.createElement('span');id.className='bf-id';
  const c=document.createElement('span');c.className='bf-code';c.textContent=code;
  const n=document.createElement('span');n.className='bf-name';n.textContent=name;
  id.append(c,n);summary.append(id);
  for(const [value,label] of [[cap,'Capacità'],[ir,'Resistenza']]){
   const metric=document.createElement('span');metric.className='bf-metric';
   const val=document.createElement('span');val.textContent=value;
   const small=document.createElement('small');small.textContent=label;
   metric.append(val,small);summary.append(metric);
  }
  const arrow=document.createElement('span');arrow.className='bf-chevron';arrow.textContent='›';summary.append(arrow);
  const body=document.createElement('div');body.className='bf-detail';
  card.replaceWith(fold);body.append(card);fold.append(summary,body);
 });
}
const renderBeforeBatteryFold186=render;

<script>
// Dati tecnici in sola lettura: usa esclusivamente le misurazioni già salvate.
// Nessuna modifica alla struttura dati o alla sincronizzazione cloud.
function pairTechPanel186(pair){
 const a=batteryById(pair.a),b=batteryById(pair.b);
 const latest=c=>(c?.measurements||[]).slice().sort((x,y)=>String(x.date||'').localeCompare(String(y.date||''))).at(-1);
 const ma=latest(a),mb=latest(b);
 const diff=(key,unit)=>{
  const x=ma?.[key],y=mb?.[key];
  return typeof x==='number'&&Number.isFinite(x)&&typeof y==='number'&&Number.isFinite(y)?
   `${Math.round(Math.abs(x-y)*100)/100} ${unit}`:'—';
 };
 const fmt=(v,unit)=>typeof v==='number'&&Number.isFinite(v)?`${esc(v)} ${unit}`:'—';
 const row=(c,m,letter)=>{
  const sessions=(c?.measurements||[]).slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).slice(0,5);
  return `<div class="pair-tech-line"><strong>Cella ${letter} · ${esc(c?.code||'Non disponibile')}</strong><div><small>Ultima misurazione:</small> ${esc(m?.date||'—')} · ${fmt(m?.cap,'mAh')} · ${fmt(m?.ir,'mΩ')}</div><div><small>Sessione:</small> ${esc(m?.session||'—')} · <small>Carica:</small> ${fmt(m?.charge,'A')} · <small>Scarica:</small> ${fmt(m?.discharge,'A')} · <small>Cutoff/tensione finale:</small> ${fmt(m?.voltage,'V')} · <small>Cicli:</small> ${fmt(m?.cycles,'')}</div><details><summary>Storico recente (${(c?.measurements||[]).length} registrazioni)</summary>${sessions.length?sessions.map(x=>`<div class="pair-tech-line">${esc(x.date||'—')} · ${fmt(x.cap,'mAh')} · ${fmt(x.ir,'mΩ')} · ${esc(x.session||'Misurazione')}</div>`).join(''):'<small>Nessuna misurazione registrata.</small>'}</details></div>`;
 };
 return `<details class="pair-tech186"><summary>⚙️ Dati tecnici avanzati (facoltativi)</summary><div class="pair-tech-body"><div class="pair-tech-line"><strong>Confronto celle</strong><div>Differenza capacità: <strong>${diff('cap','mAh')}</strong> · Differenza resistenza: <strong>${diff('ir','mΩ')}</strong></div><small>Confronto indicativo delle ultime misurazioni, non un giudizio sulla qualità della coppia.</small></div>${row(a,ma,'A')}${row(b,mb,'B')}<small>Per aggiungere carica, scarica, cicli e altri dati, apri la singola cella e seleziona + Misurazione. Tutti i valori sono facoltativi.</small></div></details>`;
}
</script>

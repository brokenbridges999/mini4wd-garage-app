<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Mini4WD Garage</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edf4;background:#0c111b}*{box-sizing:border-box}body{margin:0}header{background:#111b2b;padding:20px 16px;border-bottom:1px solid #29354a}h1{margin:0;font-size:23px;letter-spacing:.5px}h1 b{color:#b6ef57}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 10px}.sub,.muted{color:#9aa9bb;font-size:13px}nav{display:flex;gap:7px;overflow:auto;padding:12px;background:#111b2b;position:sticky;top:0;z-index:2}button,.button{background:#b6ef57;border:0;border-radius:10px;color:#14200c;font-weight:700;padding:11px 14px;cursor:pointer;font-size:14px}button.secondary{background:#25334a;color:#eef2f7}button.danger{background:#49232b;color:#ffc9ce}nav button{white-space:nowrap;background:#233148;color:#d7e0ee}nav button.active{background:#b6ef57;color:#17210f}main{max-width:850px;margin:auto;padding:18px 14px 80px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#182335;border:1px solid #344154;border-radius:14px;overflow:hidden}.pad{padding:14px}.photo{width:100%;height:160px;object-fit:cover;background:#27364b;display:flex;align-items:center;justify-content:center;color:#8c9aab;font-size:36px}.hero{height:240px}.name{font-weight:750;font-size:16px}.tag{display:inline-block;background:#33465c;color:#e5eefa;border-radius:6px;font-size:12px;padding:4px 7px;margin-top:8px}label{display:block;font-size:13px;color:#b6c4d5;margin:12px 0 5px}input,select,textarea{width:100%;background:#101a29;border:1px solid #42516a;border-radius:9px;padding:12px;color:#f5f8ff;font:inherit;font-size:15px}textarea{min-height:78px}input[type=file]{font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.section{background:#182335;border:1px solid #334154;border-radius:12px;padding:12px;margin:12px 0}.section h3{margin:0 0 8px}.item{border-bottom:1px solid #2d3a4b;padding:9px 0;display:flex;justify-content:space-between;gap:12px;font-size:14px}.item:last-child{border:0}.item span:first-child{color:#aebcd0}.changed{color:#b6ef57;font-size:12px}.empty{text-align:center;padding:35px 18px;background:#182335;border-radius:14px;color:#9eacbe}.small{font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.actions button{flex:1}.event{margin-bottom:12px}.event .diff{font-size:13px;margin:7px 0;color:#c7d4e2}.notice{background:#263b2d;color:#c3f3c9;border-radius:10px;padding:11px;margin:12px 0}.filelink{color:#b6ef57}.spacer{height:12px}@media(max-width:420px){.photo{height:125px}.hero{height:210px}.fields{gap:0 9px}.name{font-size:14px}} </style></head><body><header><h1>MINI4WD <b>GARAGE</b></h1><div class="sub">BUILD · RACE · REMEMBER <span style="float:right">BETA 1.1</span></div></header><nav id="nav"></nav><main id="app"></main><script>
'use strict';const KEY='mini4wd-garage-v1';const defs=[['Motore e trasmissione',[['motor','Motore'],['ratio','Rapporto']]],['Roller',[['frontRoller','Roller anteriori'],['rearRoller','Roller posteriori']]],['Gomme',[['frontTire','Gomme anteriori'],['rearTire','Gomme posteriori']]],['Freni',[['frontBrakeColor','Colore freno anteriore'],['frontBrakeHeight','Altezza freno ant. (mm)'],['rearBrakeColor','Colore freno posteriore'],['rearBrakeHeight','Altezza freno post. (mm)']]],['Mass damper',[['frontDamper','Anteriori (g)'],['centerDamper','Centrali (g)'],['rearDamper','Posteriori (g)']]],['Peso',[['weight','Peso totale (g)']]]];const blank=()=>Object.fromEntries(defs.flatMap(g=>g[1].map(f=>[f[0],'' ])));let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.cars))data={categories:['B-MAX','Open','Stock','Classica'],cars:[],events:[]};let page='garage',selected=null,mode=null,form=null,base=null,photo=null,track=null,notice='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>new Date().toISOString().slice(0,10),car=()=>data.cars.find(x=>x.id===selected),diff=(a,b)=>defs.flatMap(g=>g[1]).filter(f=>String(a?.[f[0]]??'')!==String(b?.[f[0]]??''));function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Spazio del browser esaurito. Esporta un backup e usa foto più piccole.');return false}}function go(p){page=p;mode=null;notice='';selected=null;render()}function nav(){const tabs=[['garage','🚗 Garage'],['work','🔧 Workshop'],['race','🏁 Race Log'],['history','🕘 History'],['catalog','📦 Catalogo'],['news','📰 News'],['settings','⚙️ Dati']];$('nav').innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}function image(src,hero=false){return src?`<img class="photo ${hero?'hero':''}" src="${src}" alt="Fotografia Mini4WD">`:`<div class="photo ${hero?'hero':''}">📷</div>`}function listCars(){return `<h2>My Garage</h2><div class="row"><p class="muted">${data.cars.length} macchine</p><button onclick="startCar()">+ Aggiungi</button></div>${data.cars.length?`<div class="grid">${data.cars.map(c=>`<div class="card" onclick="selected='${c.id}';render()" role="button" tabindex="0">${image(c.photo)}<div class="pad"><div class="name">${esc(c.name)}</div><div class="muted">Telaio ${esc(c.chassis)}</div><span class="tag">${esc(c.category)}</span></div></div>`).join('')}</div>`:'<div class="empty">Il tuo garage è vuoto.<br>Aggiungi la prima Mini4WD.</div>'}`}function sectionValues(s){return defs.map(g=>`<div class="section"><h3>${g[0]}</h3>${g[1].map(f=>`<div class="item"><span>${f[1]}</span><strong>${esc(s[f[0]]||'—')}</strong></div>`).join('')}</div>`).join('')}function detail(){const c=car();return `<button class="secondary" onclick="selected=null;render()">← Garage</button><div class="spacer"></div><div class="card">${image(c.photo,true)}<div class="pad"><h2>${esc(c.name)}</h2><div class="muted">Telaio ${esc(c.chassis)} · <span class="tag">${esc(c.category)}</span></div></div></div><div class="actions"><button onclick="startCar('${c.id}')">Modifica base</button><button class="secondary" onclick="startEvent('work','${c.id}')">Workshop</button><button class="secondary" onclick="startEvent('race','${c.id}')">Nuova gara</button></div><h2>Setup base</h2>${sectionValues(c.setup)}`}function inputs(){return defs.map(g=>`<div class="section"><h3>${g[0]}</h3><div class="fields">${g[1].map(f=>`<div><label>${f[1]}</label><input data-field="${f[0]}" value="${esc(form.setup[f[0]])}" oninput="updateField(this)"><div class="changed" id="chg-${f[0]}">${base&&String(form.setup[f[0]])!==String(base[f[0]])?'Modificato da '+esc(base[f[0]]||'—'):''}</div></div>`).join('')}</div></div>`).join('')}function categorySelect(value){return `<select id="category" onchange="form.category=this.value">${data.categories.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function startCar(cid){let c=data.cars.find(x=>x.id===cid);form=c?JSON.parse(JSON.stringify(c)):{id:null,name:'',chassis:'FM-A',category:data.categories[0],setup:blank(),photo:''};base=null;photo=form.photo;mode='car';page='garage';render()}function updateField(el){form.setup[el.dataset.field]=el.value;if(base)$('chg-'+el.dataset.field).textContent=String(el.value)!==String(base[el.dataset.field])?'Modificato da '+(base[el.dataset.field]||'—'):''}function carForm(){return `<button class="secondary" onclick="mode=null;render()">← Annulla</button><h2>${form.id?'Modifica Mini4WD':'Nuova Mini4WD'}</h2><div class="section">${image(photo)}<label>Fotografia della macchina</label><input type="file" accept="image/*" onchange="loadPhoto(this)"><label>Nome</label><input id="name" value="${esc(form.name)}" oninput="form.name=this.value"><label>Telaio</label><select id="chassis" onchange="form.chassis=this.value">${['FM-A','Super FM','VZ','MA','MS','VS','AR','Super II','Super X','Super XX','TZ-X','Altro'].map(v=>`<option ${form.chassis===v?'selected':''}>${v}</option>`).join('')}</select><label>Categoria</label>${categorySelect(form.category)}</div><h2>Setup base</h2>${inputs()}<button onclick="saveCar()">Salva Mini4WD</button>`}function saveCar(){const nameInput=$('name');if(nameInput)form.name=nameInput.value.trim();const chassisInput=$('chassis');if(chassisInput)form.chassis=chassisInput.value;const categoryInput=$('category');if(categoryInput)form.category=categoryInput.value;if(!form.name)return alert('Inserisci il nome della macchina nel campo Nome in alto.');if(!form.category)return alert('Seleziona una categoria');if(form.id){const i=data.cars.findIndex(c=>c.id===form.id);data.cars[i]=JSON.parse(JSON.stringify(form));selected=form.id}else{form.id=id();data.cars.push(JSON.parse(JSON.stringify(form)));selected=form.id}if(persist()){mode=null;render()}}async function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}async function loadPhoto(el){if(!el.files[0])return;try{photo=await resizePhoto(el.files[0]);form.photo=photo;render()}catch{alert('Impossibile leggere la foto')}}function chooseCar(){return `<label>Seleziona Mini4WD</label><select id="choose" onchange="selected=this.value;render()">${data.cars.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)} · ${esc(c.chassis)}</option>`).join('')}</select>`}function startEvent(type,cid){if(!data.cars.length)return alert('Aggiungi prima una Mini4WD');page=type;selected=cid||data.cars[0].id;const c=car();base={...c.setup};form={type,carId:c.id,carName:c.name,chassis:c.chassis,category:c.category,before:{...base},setup:{...base},title:'',date:today(),trackName:'',trackFile:null,result:'',notes:''};track=null;mode='event';render()}function eventPage(type){if(!data.cars.length)return '<div class="empty">Prima aggiungi una Mini4WD in Garage.</div>';if(mode!=='event')return `<h2>${type==='work'?'Workshop':'Race Log'}</h2><p class="muted">${type==='work'?'Registra le modifiche fatte a casa e aggiorna il setup base.':'Registra pista, risultato e configurazione della gara.'}</p>${chooseCar()}<div class="spacer"></div><button onclick="startEvent('${type}',selected)">+ ${type==='work'?'Nuovo intervento':'Nuova gara'}</button>`;return `<button class="secondary" onclick="mode=null;render()">← Annulla</button><h2>${type==='work'?'Intervento Workshop':'Nuova gara'}</h2><p class="muted">${esc(form.carName)} · ${esc(form.category)}</p>${type==='race'?`<label>Nome gara *</label><input id="eventTitle" value="${esc(form.title)}" oninput="form.title=this.value" placeholder="Es. Gara VRT"><label>Data</label><input type="date" value="${form.date}" onchange="form.date=this.value"><label>Nome tracciato</label><input value="${esc(form.trackName)}" oninput="form.trackName=this.value" placeholder="Es. Pista tecnica"><label>Foto o PDF tracciato (max 1,5 MB)</label><input type="file" accept="image/*,application/pdf" onchange="loadTrack(this)">${track?`<div class="muted">Allegato: ${esc(track.name)}</div>`:''}<label>Risultato</label><select onchange="form.result=this.value"><option value="">Seleziona</option>${['Gara completata','Podio','Vittoria','Course out','Ritiro'].map(v=>`<option>${v}</option>`).join('')}</select>`:`<label>Intervento</label><input value="${esc(form.title)}" oninput="form.title=this.value" placeholder="Es. Preparazione pista tecnica"><label>Data</label><input type="date" value="${form.date}" onchange="form.date=this.value">`}<h2 style="margin-top:22px">Setup completo</h2><p class="muted">Cambia qualsiasi valore oppure lascialo invariato.</p>${inputs()}<label>Note</label><textarea oninput="form.notes=this.value">${esc(form.notes)}</textarea><div class="section"><strong>Modifiche rilevate: <span id="diffCount">${diff(base,form.setup).length}</span></strong><div id="diffList">${differenceHtml(base,form.setup)}</div></div><button onclick="saveEvent()">${type==='work'?'Salva e aggiorna setup base':'Salva gara nello storico'}</button>`}function differenceHtml(a,b){const ds=diff(a,b);return ds.length?ds.map(f=>`<div class="diff">${esc(f[1])}: ${esc(a[f[0]]||'—')} → <b>${esc(b[f[0]]||'—')}</b></div>`).join(''):'<p class="muted">Nessuna modifica rispetto al setup base.</p>'}const originalUpdate=updateField;updateField=function(el){originalUpdate(el);if($('diffCount')){$('diffCount').textContent=diff(base,form.setup).length;$('diffList').innerHTML=differenceHtml(base,form.setup)}};function loadTrack(el){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Allegato troppo grande. Massimo 1,5 MB.');el.value='';return}const r=new FileReader();r.onload=()=>{track={name:f.name,type:f.type,data:r.result};form.trackFile=track};r.readAsDataURL(f)}function saveEvent(){if(form.type==='race'&&!form.title.trim())return alert('Inserisci il nome della gara');const e={id:id(),type:form.type,carId:form.carId,carName:form.carName,chassis:form.chassis,category:form.category,title:form.title||'Intervento Workshop',date:form.date,trackName:form.trackName,trackFile:form.trackFile,result:form.result,notes:form.notes,before:{...form.before},after:{...form.setup}};if(form.type==='work'){const c=data.cars.find(c=>c.id===form.carId);if(c)c.setup={...form.setup}}data.events.unshift(e);if(persist()){mode=null;selected=null;page='history';render()}}function history(){return `<h2>My History</h2><p class="muted">Le configurazioni storiche restano immutate anche quando modifichi il garage.</p>${data.events.length?data.events.map(e=>`<div class="section event"><div class="row"><strong>${e.type==='race'?'🏁':'🔧'} ${esc(e.title)}</strong><span class="tag">${e.type==='race'?'Gara':'Workshop'}</span></div><p class="muted">${esc(e.carName)} · ${esc(e.chassis)} · ${esc(e.category)} · ${esc(e.date)}</p>${e.trackName?`<p class="small">Pista: ${esc(e.trackName)}</p>`:''}${e.result?`<p class="small">Risultato: ${esc(e.result)}</p>`:''}${e.trackFile?`<a class="filelink" download="${esc(e.trackFile.name)}" href="${e.trackFile.data}">📎 Scarica tracciato</a>`:''}${differenceHtml(e.before,e.after)}${e.notes?`<p class="muted">${esc(e.notes)}</p>`:''}<details><summary class="muted">Visualizza setup completo</summary>${sectionValues(e.after)}</details><div class="actions"><button class="secondary" onclick="restoreEvent('${e.id}')">Copia setup nella macchina</button><button class="danger" onclick="deleteEvent('${e.id}')">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun intervento o gara registrata.</div>'}`}function restoreEvent(eid){const e=data.events.find(x=>x.id===eid),c=data.cars.find(x=>x.id===e.carId);if(!c)return alert('Questa macchina non è più nel garage');if(!confirm('Copiare questo setup nel garage? Il setup attuale sarà sostituito.'))return;const before={...c.setup};c.setup={...e.after};data.events.unshift({id:id(),type:'work',carId:c.id,carName:c.name,chassis:c.chassis,category:c.category,title:'Ripristino setup storico',date:today(),before,after:{...c.setup},notes:'Ripristinato da '+e.title});persist();render()}function deleteEvent(eid){if(confirm('Eliminare definitivamente questa voce?')){data.events=data.events.filter(e=>e.id!==eid);persist();render()}}function catalog(){return `<h2>Parts Catalog</h2><p class="muted">Catalogo sperimentale. Inserisci un codice per cercarlo sul sito ufficiale Tamiya. Nessun database completo è ancora integrato.</p><label>Codice o nome componente</label><input id="part" placeholder="Es. 15492"><div class="actions"><button onclick="window.open('https://www.google.com/search?q='+encodeURIComponent('site:tamiya.com Mini 4WD '+$('part').value),'_blank','noopener')">Cerca codice</button><button class="secondary" onclick="window.open('https://www.tamiya.com/english/products/list.html','_blank','noopener')">Catalogo Tamiya</button></div>`}function news(){return `<h2>Tamiya News</h2><div class="section"><h3>Novità e prossime uscite</h3><p class="muted">Questa beta non scarica automaticamente le notizie: apri l'elenco ufficiale per consultare informazioni aggiornate.</p><button onclick="window.open('https://www.tamiya.com/english/newitems/list.html','_blank','noopener')">Apri nuove uscite Tamiya ↗</button></div>`}function settings(){return `<h2>Dati e categorie</h2><div class="section"><h3>Categorie</h3>${data.categories.map((c,i)=>`<div class="item"><strong>${esc(c)}</strong><span><button class="secondary" onclick="renameCat(${i})">Rinomina</button> <button class="danger" onclick="deleteCat(${i})">×</button></span></div>`).join('')}<label>Nuova categoria</label><input id="newCat" placeholder="Es. Tuned"><div class="spacer"></div><button onclick="addCat()">Aggiungi categoria</button></div><div class="section"><h3>Backup</h3><p class="muted">I dati restano soltanto in questo browser e su questo dispositivo. Esporta spesso un backup, soprattutto prima di aggiornare o cancellare i dati del browser.</p><div class="actions"><button onclick="exportData()">Esporta backup JSON</button><button class="secondary" onclick="$('importFile').click()">Importa backup</button></div><input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this)"></div><div class="section"><h3>Informazioni</h3><p class="muted">Beta locale, senza account e senza sincronizzazione tra racer. Non pubblicare il file JSON di backup: contiene i tuoi dati e le fotografie.</p></div>`}function addCat(){const x=$('newCat').value.trim();if(!x)return;if(data.categories.some(c=>c.toLowerCase()===x.toLowerCase()))return alert('Categoria già presente');data.categories.push(x);persist();render()}function renameCat(i){const old=data.categories[i],x=prompt('Nuovo nome categoria',old)?.trim();if(!x||x===old)return;if(data.categories.some((c,j)=>j!==i&&c.toLowerCase()===x.toLowerCase()))return alert('Nome già usato');data.categories[i]=x;data.cars.forEach(c=>{if(c.category===old)c.category=x});persist();render()}function deleteCat(i){const x=data.categories[i];if(data.cars.some(c=>c.category===x))return alert('Categoria utilizzata da una macchina: cambiala prima di eliminarla.');if(data.categories.length===1)return alert('Serve almeno una categoria');if(confirm('Eliminare '+x+'?')){data.categories.splice(i,1);persist();render()}}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mini4wd-garage-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(el){const f=el.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.cars)||!Array.isArray(obj.events)||!Array.isArray(obj.categories))throw Error();if(!confirm('Sostituire tutti i dati locali con questo backup?'))return;data=obj;persist();go('garage')}catch{alert('File di backup non valido')}}function render(){nav();$('app').innerHTML=page==='garage'?(mode==='car'?carForm():selected?detail():listCars()):page==='work'||page==='race'?eventPage(page):page==='history'?history():page==='catalog'?catalog():page==='news'?news():settings()}render();
</script></body></html>

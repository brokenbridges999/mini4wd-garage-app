#2d3a4b;padding:9px 0;display:flex;justify-content:space-between;gap:12px;font-size:14px}.item:last-child{border:0}.item span:first-child{color:#aebcd0}.changed{color:#b6ef57;font-size:12px}.empty{text-align:center;padding:35px 18px;background:#182335;border-radius:14px;color:#9eacbe}.small{font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.actions button{flex:1}.event{margin-bottom:12px}.event .diff{font-size:13px;margin:7px 0;color:#c7d4e2}.notice{background:#263b2d;color:#c3f3c9;border-radius:10px;padding:11px;margin:12px 0}.filelink{color:#b6ef57}.spacer{height:12px}@media(max-width:420px){.photo{height:125px}.hero{height:210px}.fields{gap:0 9px}.name{font-size:14px}} </style></head><body><header><h1>MINI4WD <b>GARAGE</b></h1><div class="sub">BUILD · RACE · REMEMBER <span style="float:right">BETA 1.8</span></div></header><nav id="nav"></nav><main id="app"></main><script>
'use strict';const KEY='mini4wd-garage-v1';const defs=[['Motore e trasmissione',[['motor','Motore'],['ratio','Rapporto']]],['Roller',[['frontRoller','Roller anteriori'],['rearRoller','Roller posteriori']]],['Gomme',[['frontTire','Gomme anteriori'],['rearTire','Gomme posteriori']]],['Freni',[['frontBrakeColor','Colore freno anteriore'],['frontBrakeHeight','Altezza freno ant. (mm)'],['rearBrakeColor','Colore freno posteriore'],['rearBrakeHeight','Altezza freno post. (mm)']]],['Mass damper',[['frontDamper','Anteriori (g)'],['centerDamper','Centrali (g)'],['rearDamper','Posteriori (g)']]],['Peso',[['weight','Peso totale (g)']]]];const blank=()=>Object.fromEntries(defs.flatMap(g=>g[1].map(f=>[f[0],'' ])));let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.cars))data={categories:['B-MAX','Open','Stock','Classica'],cars:[],events:[]};let page='garage',selected=null,mode=null,form=null,base=null,photo=null,track=null,notice='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>new Date().toISOString().slice(0,10),car=()=>data.cars.find(x=>x.id===selected),diff=(a,b)=>defs.flatMap(g=>g[1]).filter(f=>String(a?.[f[0]]??'')!==String(b?.[f[0]]??''));function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));scheduleCloudSave();return true}catch(e){alert('Spazio del browser esaurito. Esporta un backup e usa foto più piccole.');return false}}function go(p){page=p;mode=null;notice='';selected=null;render()}function nav(){const tabs=[['garage','🚗 Garage'],['work','🔧 Workshop'],['race','🏁 Race Log'],['history','🕘 History'],['catalog','📦 Catalogo'],['news','📰 News'],['settings','⚙️ Dati'],['cloud','☁️ Cloud']];$('nav').innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}function image(src,hero=false){return src?`<img class="photo ${hero?'hero':''}" src="${src}" alt="Fotografia Mini4WD">`:`<div class="photo ${hero?'hero':''}">📷</div>`}function listCars(){return `<h2>My Garage</h2><div class="row"><p class="muted">${data.cars.length} macchine</p><button onclick="startCar()">+ Aggiungi</button></div>${data.cars.length?`<div class="grid">${data.cars.map(c=>`<div class="card" onclick="selected='${c.id}';render()" role="button" tabindex="0">${image(c.photo)}<div class="pad"><div class="name">${esc(c.name)}</div><div class="muted">Telaio ${esc(c.chassis)}</div><span class="tag">${esc(c.category)}</span></div></div>`).join('')}</div>`:'<div class="empty">Il tuo garage è vuoto.<br>Aggiungi la prima Mini4WD.</div>'}`}function sectionValues(s){return defs.map(g=>`<div class="section"><h3>${g[0]}</h3>${g[1].map(f=>`<div class="item"><span>${f[1]}</span><strong>${esc(s[f[0]]||'—')}</strong></div>`).join('')}</div>`).join('')}function detail(){const c=car();return `<button class="secondary" onclick="selected=null;render()">← Garage</button><div class="spacer"></div><div class="card">${image(c.photo,true)}<div class="pad"><h2>${esc(c.name)}</h2><div class="muted">Telaio ${esc(c.chassis)} · <span class="tag">${esc(c.category)}</span></div></div></div><div class="actions"><button onclick="startCar('${c.id}')">Modifica base</button><button class="secondary" onclick="startEvent('work','${c.id}')">Workshop</button><button class="secondary" onclick="startEvent('race','${c.id}')">Nuova gara</button></div><h2>Setup base</h2>${sectionValues(c.setup)}`}function inputs(){return defs.map(g=>`<div class="section"><h3>${g[0]}</h3><div class="fields">${g[1].map(f=>`<div><label>${f[1]}</label><input data-field="${f[0]}" value="${esc(form.setup[f[0]])}" oninput="updateField(this)"><div class="changed" id="chg-${f[0]}">${base&&String(form.setup[f[0]])!==String(base[f[0]])?'Modificato da '+esc(base[f[0]]||'—'):''}</div></div>`).join('')}</div></div>`).join('')}function categorySelect(value){return `<select id="category" onchange="form.category=this.value">${data.categories.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}function startCar(cid){let c=data.cars.find(x=>x.id===cid);form=c?JSON.parse(JSON.stringify(c)):{id:null,name:'',chassis:'FM-A',category:data.categories[0],setup:blank(),photo:''};base=null;photo=form.photo;mode='car';page='garage';render()}function updateField(el){form.setup[el.dataset.field]=el.value;if(base)$('chg-'+el.dataset.field).textContent=String(el.value)!==String(base[el.dataset.field])?'Modificato da '+(base[el.dataset.field]||'—'):''}function carForm(){return `<button class="secondary" onclick="mode=null;render()">← Annulla</button><h2>${form.id?'Modifica Mini4WD':'Nuova Mini4WD'}</h2><div class="section">${image(photo)}<label>Fotografia della macchina</label><input type="file" accept="image/*" onchange="loadPhoto(this)"><label>Nome</label><input id="name" value="${esc(form.name)}" oninput="form.name=this.value"><label>Telaio</label><select id="chassis" onchange="form.chassis=this.value">${['FM-A','Super FM','VZ','MA','MS','VS','AR','Super II','Super X','Super XX','TZ-X','Altro'].map(v=>`<option ${form.chassis===v?'selected':''}>${v}</option>`).join('')}</select><label>Categoria</label>${categorySelect(form.category)}</div><h2>Setup base</h2>${inputs()}<button onclick="saveCar()">Salva Mini4WD</button>`}function saveCar(){const nameInput=$('name');if(nameInput)form.name=nameInput.value.trim();const chassisInput=$('chassis');if(chassisInput)form.chassis=chassisInput.value;const categoryInput=$('category');if(categoryInput)form.category=categoryInput.value;if(!form.name)return alert('Inserisci il nome della macchina nel campo Nome in alto.');if(!form.category)return alert('Seleziona una categoria');if(form.id){const i=data.cars.findIndex(c=>c.id===form.id);data.cars[i]=JSON.parse(JSON.stringify(form));selected=form.id}else{form.id=id();data.cars.push(JSON.parse(JSON.stringify(form)));selected=form.id}if(persist()){mode=null;render()}}async function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}async function loadPhoto(el){if(!el.files[0])return;try{photo=await resizePhoto(el.files[0]);form.photo=photo;render()}catch{alert('Impossibile leggere la foto')}}function chooseCar(){return `<label>Seleziona Mini4WD</label><select id="choose" onchange="selected=this.value;render()">${data.cars.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)} · ${esc(c.chassis)}</option>`).join('')}</select>`}function startEvent(type,cid){if(!data.cars.length)return alert('Aggiungi prima una Mini4WD');page=type;selected=cid||data.cars[0].id;const c=car();base={...c.setup};form={type,carId:c.id,carName:c.name,chassis:c.chassis,category:c.category,before:{...base},setup:{...base},title:'',date:today(),trackName:'',trackFile:null,result:'',notes:''};track=null;mode='event';render()}function eventPage(type){if(!data.cars.length)return '<div class="empty">Prima aggiungi una Mini4WD in Garage.</div>';if(mode!=='event')return `<h2>${type==='work'?'Workshop':'Race Log'}</h2><p class="muted">${type==='work'?'Registra le modifiche fatte a casa e aggiorna il setup base.':'Registra pista, risultato e configurazione della gara.'}</p>${chooseCar()}<div class="spacer"></div><button onclick="startEvent('${type}',selected)">+ ${type==='work'?'Nuovo intervento':'Nuova gara'}</button>`;return `<button class="secondary" onclick="mode=null;render()">← Annulla</button><h2>${type==='work'?'Intervento Workshop':'Nuova gara'}</h2><p class="muted">${esc(form.carName)} · ${esc(form.category)}</p>${type==='race'?`<label>Nome gara *</label><input id="eventTitle" value="${esc(form.title)}" oninput="form.title=this.value" placeholder="Es. Gara VRT"><label>Data</label><input type="date" value="${form.date}" onchange="form.date=this.value"><label>Nome tracciato</label><input value="${esc(form.trackName)}" oninput="form.trackName=this.value" placeholder="Es. Pista tecnica"><label>Foto o PDF tracciato (max 1,5 MB)</label><input type="file" accept="image/*,application/pdf" onchange="loadTrack(this)">${track?`<div class="muted">Allegato: ${esc(track.name)}</div>`:''}<label>Risultato</label><select onchange="form.result=this.value"><option value="">Seleziona</option>${['Gara completata','Podio','Vittoria','Course out','Ritiro'].map(v=>`<option>${v}</option>`).join('')}</select>`:`<label>Intervento</label><input value="${esc(form.title)}" oninput="form.title=this.value" placeholder="Es. Preparazione pista tecnica"><label>Data</label><input type="date" value="${form.date}" onchange="form.date=this.value">`}<h2 style="margin-top:22px">Setup completo</h2><p class="muted">Cambia qualsiasi valore oppure lascialo invariato.</p>${inputs()}<label>Note</label><textarea oninput="form.notes=this.value">${esc(form.notes)}</textarea><div class="section"><strong>Modifiche rilevate: <span id="diffCount">${diff(base,form.setup).length}</span></strong><div id="diffList">${differenceHtml(base,form.setup)}</div></div><button onclick="saveEvent()">${type==='work'?'Salva e aggiorna setup base':'Salva gara nello storico'}</button>`}function differenceHtml(a,b){const ds=diff(a,b);return ds.length?ds.map(f=>`<div class="diff">${esc(f[1])}: ${esc(a[f[0]]||'—')} → <b>${esc(b[f[0]]||'—')}</b></div>`).join(''):'<p class="muted">Nessuna modifica rispetto al setup base.</p>'}const originalUpdate=updateField;updateField=function(el){originalUpdate(el);if($('diffCount')){$('diffCount').textContent=diff(base,form.setup).length;$('diffList').innerHTML=differenceHtml(base,form.setup)}};function loadTrack(el){const f=el.files[0];if(!f)return;if(f.size>1500000){alert('Allegato troppo grande. Massimo 1,5 MB.');el.value='';return}const r=new FileReader();r.onload=()=>{track={name:f.name,type:f.type,data:r.result};form.trackFile=track};r.readAsDataURL(f)}function saveEvent(){if(form.type==='race'&&!form.title.trim())return alert('Inserisci il nome della gara');const e={id:id(),type:form.type,carId:form.carId,carName:form.carName,chassis:form.chassis,category:form.category,title:form.title||'Intervento Workshop',date:form.date,trackName:form.trackName,trackFile:form.trackFile,result:form.result,notes:form.notes,before:{...form.before},after:{...form.setup}};if(form.type==='work'){const c=data.cars.find(c=>c.id===form.carId);if(c)c.setup={...form.setup}}data.events.unshift(e);if(persist()){mode=null;selected=null;page='history';render()}}function history(){return `<h2>My History</h2><p class="muted">Le configurazioni storiche restano immutate anche quando modifichi il garage.</p>${data.events.length?data.events.map(e=>`<div class="section event"><div class="row"><strong>${e.type==='race'?'🏁':'🔧'} ${esc(e.title)}</strong><span class="tag">${e.type==='race'?'Gara':'Workshop'}</span></div><p class="muted">${esc(e.carName)} · ${esc(e.chassis)} · ${esc(e.category)} · ${esc(e.date)}</p>${e.trackName?`<p class="small">Pista: ${esc(e.trackName)}</p>`:''}${e.result?`<p class="small">Risultato: ${esc(e.result)}</p>`:''}${e.trackFile?`<a class="filelink" download="${esc(e.trackFile.name)}" href="${e.trackFile.data}">📎 Scarica tracciato</a>`:''}${differenceHtml(e.before,e.after)}${e.notes?`<p class="muted">${esc(e.notes)}</p>`:''}<details><summary class="muted">Visualizza setup completo</summary>${sectionValues(e.after)}</details><div class="actions"><button class="secondary" onclick="restoreEvent('${e.id}')">Copia setup nella macchina</button><button class="danger" onclick="deleteEvent('${e.id}')">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun intervento o gara registrata.</div>'}`}function restoreEvent(eid){const e=data.events.find(x=>x.id===eid),c=data.cars.find(x=>x.id===e.carId);if(!c)return alert('Questa macchina non è più nel garage');if(!confirm('Copiare questo setup nel garage? Il setup attuale sarà sostituito.'))return;const before={...c.setup};c.setup={...e.after};data.events.unshift({id:id(),type:'work',carId:c.id,carName:c.name,chassis:c.chassis,category:c.category,title:'Ripristino setup storico',date:today(),before,after:{...c.setup},notes:'Ripristinato da '+e.title});persist();render()}function deleteEvent(eid){if(confirm('Eliminare definitivamente questa voce?')){data.events=data.events.filter(e=>e.id!==eid);persist();render()}}function catalog(){return `<h2>Parts Catalog</h2><p class="muted">Catalogo sperimentale. Inserisci un codice per cercarlo sul sito ufficiale Tamiya. Nessun database completo è ancora integrato.</p><label>Codice o nome componente</label><input id="part" placeholder="Es. 15492"><div class="actions"><button onclick="window.open('https://www.google.com/search?q='+encodeURIComponent('site:tamiya.com Mini 4WD '+$('part').value),'_blank','noopener')">Cerca codice</button><button class="secondary" onclick="window.open('https://www.tamiya.com/english/products/list.html','_blank','noopener')">Catalogo Tamiya</button></div>`}function news(){return `<h2>Tamiya News</h2><div class="section"><h3>Novità e prossime uscite</h3><p class="muted">Questa beta non scarica automaticamente le notizie: apri l'elenco ufficiale per consultare informazioni aggiornate.</p><button onclick="window.open('https://www.tamiya.com/english/newitems/list.html','_blank','noopener')">Apri nuove uscite Tamiya ↗</button></div>`}function settings(){return `<h2>Dati e categorie</h2><div class="section"><h3>Categorie</h3>${data.categories.map((c,i)=>`<div class="item"><strong>${esc(c)}</strong><span><button class="secondary" onclick="renameCat(${i})">Rinomina</button> <button class="danger" onclick="deleteCat(${i})">×</button></span></div>`).join('')}<label>Nuova categoria</label><input id="newCat" placeholder="Es. Tuned"><div class="spacer"></div><button onclick="addCat()">Aggiungi categoria</button></div><div class="section"><h3>Backup</h3><p class="muted">I dati restano soltanto in questo browser e su questo dispositivo. Esporta spesso un backup, soprattutto prima di aggiornare o cancellare i dati del browser.</p><div class="actions"><button onclick="exportData()">Esporta backup JSON</button><button class="secondary" onclick="$('importFile').click()">Importa backup</button></div><input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this)"></div><div class="section"><h3>Informazioni</h3><p class="muted">Beta locale, senza account e senza sincronizzazione tra racer. Non pubblicare il file JSON di backup: contiene i tuoi dati e le fotografie.</p></div>`}function addCat(){const x=$('newCat').value.trim();if(!x)return;if(data.categories.some(c=>c.toLowerCase()===x.toLowerCase()))return alert('Categoria già presente');data.categories.push(x);persist();render()}function renameCat(i){const old=data.categories[i],x=prompt('Nuovo nome categoria',old)?.trim();if(!x||x===old)return;if(data.categories.some((c,j)=>j!==i&&c.toLowerCase()===x.toLowerCase()))return alert('Nome già usato');data.categories[i]=x;data.cars.forEach(c=>{if(c.category===old)c.category=x});persist();render()}function deleteCat(i){const x=data.categories[i];if(data.cars.some(c=>c.category===x))return alert('Categoria utilizzata da una macchina: cambiala prima di eliminarla.');if(data.categories.length===1)return alert('Serve almeno una categoria');if(confirm('Eliminare '+x+'?')){data.categories.splice(i,1);persist();render()}}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mini4wd-garage-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(el){const f=el.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.cars)||!Array.isArray(obj.events)||!Array.isArray(obj.categories))throw Error();if(!confirm('Sostituire tutti i dati locali con questo backup?'))return;data=obj;persist();go('garage')}catch{alert('File di backup non valido')}}function render(){nav();$('app').innerHTML=page==='garage'?(mode==='car'?carForm():selected?detail():listCars()):page==='work'||page==='race'?eventPage(page):page==='history'?history():page==='catalog'?catalog():page==='news'?news():page==='cloud'?cloudPage():settings()}
// Beta 1.3: sync cloud, conservando sempre il backup locale.
const CLOUD_CONFIG_KEY='mini4wd-cloud-config-v13', CLOUD_SESSION_KEY='mini4wd-cloud-session-v13';
const CLOUD_DEFAULT={url:'https://zsnoncvmexcrdnbhvfjk.supabase.co',key:'sb_publishable_mDBNo-5nzqGGiMBmX2h89A_QH-YoqAC'};
let cloudConfig={...CLOUD_DEFAULT,...JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')};
let cloudSession=JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY)||'null');
let cloudReady=false, cloudBusy=false, cloudDirty=false, cloudTimer=null, cloudStatus='Non collegato';
function cloudUrl(path){return cloudConfig.url.replace(/\/+$/,'')+path}
function cloudHeaders(auth=true){return {'apikey':cloudConfig.key,'Content-Type':'application/json',...(auth&&cloudSession?.access_token?{'Authorization':'Bearer '+cloudSession.access_token}:{})}}
function cloudMessage(s){cloudStatus=s;if(page==='cloud')render()}
async function cloudRequest(path,opts={}){const r=await fetch(cloudUrl(path),{...opts,headers:{...cloudHeaders(),...(opts.headers||{})}});const raw=await r.text();let val;try{val=raw?JSON.parse(raw):null}catch{val=raw}if(!r.ok)throw Error(val?.msg||val?.message||val?.error_description||val?.error||('HTTP '+r.status));return val}
async function refreshCloudToken(){if(!cloudSession?.refresh_token)throw Error('Sessione scaduta. Accedi nuovamente.');const r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});cloudSession=r;localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(r))}
async function cloudAuthRequest(path,opts){try{return await cloudRequest(path,opts)}catch(e){if(String(e.message).includes('JWT expired')){await refreshCloudToken();return await cloudRequest(path,opts)}throw e}}
function cloudConfigSave(){const u=$('cloud-url').value.trim().replace(/\/+$/,'');const k=$('cloud-key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u))return alert('Inserisci il Project URL Supabase, ad esempio https://xxxxx.supabase.co');if(!k||!k.startsWith('sb_publishable_')&&!k.startsWith('eyJ'))return alert('Inserisci la Publishable key o la vecchia anon key. Mai la secret key.');cloudConfig={url:u,key:k};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));cloudMessage('Configurazione salvata. Ora accedi.');}
async function cloudLogin(){if(!cloudConfig.url||!cloudConfig.key)return alert('Prima salva URL e chiave pubblica.');const email=$('cloud-email').value.trim(),password=$('cloud-password').value;if(!email||!password)return alert('Inserisci email e password.');cloudBusy=true;cloudMessage('Accesso in corso…');try{const sess=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});cloudSession=sess;localStorage.setItem(CLOUD_SESSION_KEY,JSON.stringify(sess));cloudReady=false;cloudMessage('Accesso riuscito. Scegli se caricare i dati locali o scaricare quelli online.')}catch(e){cloudMessage('Accesso non riuscito: '+e.message)}finally{cloudBusy=false}}
function cloudLogout(){cloudSession=null;cloudReady=false;localStorage.removeItem(CLOUD_SESSION_KEY);cloudMessage('Disconnesso. I dati locali restano sul dispositivo.')}
async function cloudRead(){try{return await cloudAuthRequest('/rest/v1/garage_state?select=payload&user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&limit=1',{method:'GET'})}catch(e){if(String(e.message).includes('JWT')){await refreshCloudToken();return cloudAuthRequest('/rest/v1/garage_state?select=payload&user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&limit=1',{method:'GET'})}throw e}}
async function cloudWrite(){if(!cloudSession||!cloudConfig.url||!cloudReady)return;const payload=JSON.parse(JSON.stringify(data));await cloudAuthRequest('/rest/v1/garage_state?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:cloudSession.user.id,payload,updated_at:new Date().toISOString()})});cloudDirty=false;cloudMessage('Sincronizzato online ✓')}
function scheduleCloudSave(){if(!cloudReady||!cloudSession)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{try{await cloudWrite()}catch(e){cloudMessage('Salvataggio online non riuscito: '+e.message)}},700)}
async function cloudUpload(){if(!cloudSession)return alert('Prima accedi.');if(!confirm('Caricare nel cloud il garage di QUESTO dispositivo? Se ci sono dati online verranno sostituiti. Hai già esportato il backup JSON?'))return;cloudBusy=true;cloudMessage('Caricamento in corso…');try{cloudReady=true;await cloudWrite();cloudMessage('Garage caricato online! Ora accedi anche dal telefono.')}catch(e){cloudReady=false;cloudMessage('Errore: '+e.message)}finally{cloudBusy=false}}
async function cloudDownload(){if(!cloudSession)return alert('Prima accedi.');cloudBusy=true;cloudMessage('Lettura dal cloud…');try{const rows=await cloudRead();if(!rows?.length){cloudMessage('Il cloud è vuoto. Sul Mac usa «Carica questo garage nel cloud».');return}const remote=rows[0].payload;if(!remote||!Array.isArray(remote.cars)||!Array.isArray(remote.events)||!Array.isArray(remote.categories))throw Error('Dati online non validi');if(!confirm('Scaricare il garage online? Sostituirà la copia visibile su QUESTO dispositivo. Prima esporta un backup locale se contiene dati importanti.'))return;cloudReady=false;data=remote;localStorage.setItem(KEY,JSON.stringify(data));cloudReady=true;cloudStatus='Garage scaricato e sincronizzazione attiva ✓';go('garage')}catch(e){cloudMessage('Errore: '+e.message)}finally{cloudBusy=false}}
function cloudPage(){const connected=!!cloudSession?.user;return `<h2>☁️ Cloud · Beta 1.3</h2><div class="section"><h3>1. Collegamento Supabase</h3><p class="muted">Usa Project URL e Publishable key. Non inserire mai la Secret key o service_role.</p><label>Project URL</label><input id="cloud-url" value="${esc(cloudConfig.url||'')}" placeholder="https://xxxxx.supabase.co"><label>Publishable key</label><input id="cloud-key" type="password" value="${esc(cloudConfig.key||'')}" placeholder="sb_publishable_..."><div class="spacer"></div><button onclick="cloudConfigSave()">Salva configurazione</button></div><div class="section"><h3>2. Account pilota</h3>${connected?`<p class="notice">Accesso: ${esc(cloudSession.user.email||'utente')}</p><button class="secondary" onclick="cloudLogout()">Esci</button>`:`<label>Email</label><input id="cloud-email" type="email" autocomplete="email"><label>Password</label><input id="cloud-password" type="password" autocomplete="current-password"><div class="spacer"></div><button onclick="cloudLogin()">Accedi</button><p class="muted">Usa l'utente che hai creato in Supabase Authentication.</p>`}</div><div class="section"><h3>3. Sincronizzazione</h3><p class="muted">Sul Mac che contiene la Crimson: carica i dati locali nel cloud una sola volta. Sul telefono: scaricali dal cloud. Le modifiche successive si salvano automaticamente dopo l'attivazione.</p><div class="actions"><button ${!connected?'disabled':''} onclick="cloudUpload()">⬆ Carica questo garage nel cloud</button><button class="secondary" ${!connected?'disabled':''} onclick="cloudDownload()">⬇ Scarica garage dal cloud</button></div><p class="notice">${esc(cloudStatus)}</p><p class="muted">Non chiudere la pagina se compare un errore di salvataggio. Esporta il backup da Dati.</p></div>`}

let inventoryKind='motor',inventoryEdit=null,inventoryCar=null;

function componentForm(cid){

 return `<h2>${c?'Modifica':'Nuovo'} ${compKind(inventoryKind).toLowerCase()}</h2>

 </div><div class="actions"><button onclick="saveComponent()">Salva</button><button class="secondary" onclick="inventoryEdit=null;render()">Annulla</button></div>`;

function saveComponent(){
 const code=$('comp-code').value.trim(),name=$('comp-name').value.trim(),notes=$('comp-notes').value.trim();
 if(!code||!name)return alert('Inserisci codice e nome.');
 if(data.components.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==inventoryEdit))return alert('Questo codice esiste già.');
 if(inventoryEdit&&inventoryEdit!=='new'){const c=data.components.find(x=>x.id===inventoryEdit);Object.assign(c,{code,name,notes})}
 else data.components.push({id:id(),kind:inventoryKind,code,name,notes,assignedCarId:null,measurements:[],createdAt:today()});

let entryComponent=null,entryType='measure';
function addMeasurement(cid){entryComponent=cid;entryType='measure';render()}
function addDiary(cid){entryComponent=cid;entryType='diary';render()}
function entryForm(){
 const c=data.components.find(x=>x.id===entryComponent);if(!c){entryComponent=null;return inventory()}
 const motor=c.kind==='motor';const measure=entryType==='measure';
 return `<button class="secondary" onclick="entryComponent=null;render()">← Archivio</button><h2>${measure?'Nuova misurazione':'Diario interventi'}</h2><p class="muted">${esc(componentName(c))} · Privato</p>
 <div class="section"><label>Data</label><input type="date" id="entry-date" value="${today()}">
 ${measure&&motor?`<label>RPM</label><input id="entry-rpm" inputmode="numeric" type="number" min="0" placeholder="Es. 28000">
 <label>Voltaggio prova (V)</label><input id="entry-volt" inputmode="decimal" type="number" min="0" step="0.01" value="2.8">
 <label>Assorbimento (A) · facoltativo</label><input id="entry-amps" inputmode="decimal" type="number" min="0" step="0.01" placeholder="Es. 0.85">
 <label>Strumento RPM</label><select id="entry-tool"><option>App Giri</option><option>Motorboot</option><option>Altro</option></select>`:''}
 ${measure&&!motor?`<label>Misurazione</label><input id="entry-value" placeholder="Es. capacità 920 mAh, IR 25 mΩ">`:''}
 ${!measure?`<label>Intervento effettuato</label><textarea id="entry-value" placeholder="Es. Rodaggio 15 minuti a 2 V, poi pulizia e lubrificazione"></textarea>`:''}
 <label>Note facoltative</label><textarea id="entry-notes" placeholder="Aggiungi dettagli solo se ti servono"></textarea></div>
 <button onclick="saveEntry()">Salva nello storico</button>`;
}
function saveEntry(){
 const c=data.components.find(x=>x.id===entryComponent);if(!c)return;
 const date=$('entry-date').value||today(),notes=$('entry-notes').value.trim();let entry;
 if(entryType==='measure'&&c.kind==='motor'){
  const rpm=$('entry-rpm').value,volt=$('entry-volt').value,amps=$('entry-amps').value,tool=$('entry-tool').value;
  if(!rpm||Number(rpm)<=0||!volt||Number(volt)<=0)return alert('Inserisci RPM e voltaggio validi.');
  if(amps!==''&&Number(amps)<0)return alert('Assorbimento non valido.');
  entry={id:id(),date,type:'measure',rpm:Number(rpm),voltage:Number(volt),amps:amps===''?null:Number(amps),tool,notes,value:rpm+' RPM · '+volt+' V'+(amps!==''?' · '+amps+' A':'')+' · '+tool};
 }else{
  const value=$('entry-value').value.trim();if(!value)return alert('Scrivi una misurazione o un intervento.');
  entry={id:id(),date,type:entryType,value,notes};
 }
 if(!Array.isArray(c.measurements))c.measurements=[];
 c.measurements.push(entry);entryComponent=null;persist();render();
}
function inventory(){
 if(entryComponent)return entryForm();
 const c=data.components.find(x=>x.id===inventoryEdit);
 if(inventoryEdit)return componentForm(inventoryEdit);
 const items=data.components.filter(x=>x.kind===inventoryKind);
 return `<h2>Archivio componenti</h2><p class="muted">Ogni motore e coppia batterie ha una scheda unica. Le misurazioni restano nello storico anche quando cambi macchina.</p>
 <div class="actions"><button class="${inventoryKind==='motor'?'':'secondary'}" onclick="inventoryKind='motor';render()">⚙️ Motori</button><button class="${inventoryKind==='battery'?'':'secondary'}" onclick="inventoryKind='battery';render()">🔋 Batterie</button></div>
 <button onclick="inventoryEdit='new';render()">+ Aggiungi ${compKind(inventoryKind).toLowerCase()}</button>
 <div class="spacer"></div>
 ${items.length?items.map(c=>{
 const car=data.cars.find(x=>x.id===c.assignedCarId);
 return `<div class="section"><div class="row"><strong>${esc(componentName(c))}</strong><span class="tag">${car?esc(car.name):'Disponibile'}</span></div>
 ${c.notes?`<p class="muted">${esc(c.notes)}</p>`:''}
 <p class="muted">Voci nello storico: ${c.measurements.length} · Privato</p>
 ${c.measurements.slice().reverse().slice(0,5).map(m=>`<div class="item"><span>${esc(m.date)}</span><strong>${esc(m.value)}</strong></div>${m.notes?`<p class="muted small">${esc(m.notes)}</p>`:''}`).join('')}
 <div class="actions"><button class="secondary" onclick="addMeasurement('${c.id}')">+ Misurazione</button>${c.kind==='motor'?`<button class="secondary" onclick="addDiary('${c.id}')">+ Intervento</button>`:''}<button class="secondary" onclick="inventoryEdit='${c.id}';render()">Modifica</button></div></div>`}).join(''):'<div class="empty">Nessun componente registrato.</div>'}`;
}
function assignPage(){
 const c=data.cars.find(x=>x.id===inventoryCar);
 if(!c){inventoryCar=null;return inventory()}
 const motors=data.components.filter(x=>x.kind==='motor');
 const batteries=data.components.filter(x=>x.kind==='battery');
 const opt=(arr,kind)=>`<label>${compKind(kind)}</label><select id="assign-${kind}"><option value="">— Nessuno —</option>${arr.map(x=>`<option value="${x.id}" ${x.assignedCarId===c.id?'selected':''}>${esc(componentName(x))}${x.assignedCarId&&x.assignedCarId!==c.id?' (su altra macchina)':''}</option>`).join('')}</select>`;
 return `<button class="secondary" onclick="inventoryCar=null;selected='${c.id}';page='garage';render()">← Torna alla macchina</button><h2>Componenti di ${esc(c.name)}</h2><p class="muted">Scegli dall'archivio. Se un componente è su un'altra macchina, verrà spostato e registrato nello storico.</p>
 <div class="section">${opt(motors,'motor')}${opt(batteries,'battery')}</div>
 <button onclick="saveAssignments('${c.id}')">Salva assegnazioni</button><p class="muted">Non trovi un componente? Apri Archivio e aggiungilo.</p>`;
}
function saveAssignments(cid){
 const c=data.cars.find(x=>x.id===cid);
 const changes=[];
 for(const kind of ['motor','battery']){
  const chosen=$('assign-'+kind).value;
  const old=currentPart(cid,kind);
  if((old?.id||'')===chosen)continue;
  if(old){old.assignedCarId=null;changes.push(compKind(kind)+': rimosso '+componentName(old))}
  if(chosen){
   const part=data.components.find(x=>x.id===chosen);
   const previous=data.cars.find(x=>x.id===part.assignedCarId);
   if(previous)changes.push(compKind(kind)+': spostato da '+previous.name);
   part.assignedCarId=cid;
   changes.push(compKind(kind)+': montato '+componentName(part));
  }
 }
 if(changes.length){
  data.events.unshift({id:id(),type:'work',carId:cid,carName:c.name,chassis:c.chassis,category:c.category,title:'Cambio componenti',date:today(),before:{...c.setup},after:{...c.setup},notes:changes.join(' | ')});
  persist();
 }
 inventoryCar=null;page='garage';selected=cid;render();
}

};
detail=function(){

 const motor=currentPart(c.id,'motor'),battery=currentPart(c.id,'battery');

 <div class="item"><span>Motore</span><strong>${motor?esc(componentName(motor)):'—'}</strong></div>

};
render=function(){

 if(page==='inventory'){nav();$('app').innerHTML=inventoryCar?assignPage():inventory();return}
 oldRender();
};

function batteryPairSave(){const existing=data.batteryPairs.find(x=>x.id===batteryPairEdit);const name=existing?.name||'Coppia '+String(data.batteryPairs.length+1).padStart(2,'0'),a=$('bp-a').value,b=$('bp-b').value;if(!a||!b)return alert('Seleziona due batterie');if(a===b)return alert('Seleziona due batterie diverse');const p=data.batteryPairs.find(x=>x.id===batteryPairEdit);if(p){p.history=p.history||[];if(p.a!==a||p.b!==b)p.history.push({date:today(),a:p.a,b:p.b});Object.assign(p,{name,a,b})}else data.batteryPairs.push({id:id(),name,a,b,assignedCarId:null,history:[],createdAt:today()});batteryPairEdit=null;persist();render()}
function batteryLab(){batteryInit();if(batteryMeasure)return batteryMeasureForm();if(batteryEdit)return batteryForm();if(batteryPairEdit)return batteryPairForm();const pairs=batteryScreen==='pairs';return `<h2>🔋 Battery Lab</h2><p class="muted">Batterie singole, coppie modificabili e misurazioni personali. Tutto privato.</p><div class="actions"><button class="${pairs?'secondary':''}" onclick="batteryScreen='list';render()">Batterie singole</button><button class="${pairs?'':'secondary'}" onclick="batteryScreen='pairs';render()">Le mie coppie</button></div>${pairs?`<button onclick="batteryPairEdit='new';render()">+ Crea coppia</button><div class="spacer"></div>${data.batteryPairs.length?data.batteryPairs.map(p=>`<div class="section"><strong>${esc(p.name)}</strong><p class="muted">${esc(batteryById(p.a)?.code||'Batteria mancante')} + ${esc(batteryById(p.b)?.code||'Batteria mancante')}</p><p class="muted">${p.assignedCarId?('Su '+esc(data.cars.find(x=>x.id===p.assignedCarId)?.name||'macchina')):'Disponibile'} · Abbinamenti precedenti: ${(p.history||[]).length}</p><button class="secondary" onclick="batteryPairEdit='${p.id}';render()">Cambia abbinamento</button></div>`).join(''):'<div class="empty">Nessuna coppia creata.</div>'}`:`<button onclick="batteryEdit='new';render()">+ Aggiungi batteria</button><div class="spacer"></div>${data.batteryCells.length?data.batteryCells.map(c=>{const last=c.measurements?.slice(-1)[0];return `<div class="section"><strong>🔋 ${esc(c.code)} · ${esc(c.name)}</strong><p class="muted">${esc(c.notes||'')} · ${c.measurements.length} registrazioni · Privato</p>${last?`<div class="item"><span>Ultima misurazione · ${esc(last.date)}</span><strong>${esc(last.value)}</strong></div>`:''}<details><summary class="muted">Storico completo</summary>${c.measurements.slice().reverse().map(m=>`<div class="item"><span>${esc(m.date)}</span><strong>${esc(m.value)}</strong></div>${m.notes?`<p class="muted small">${esc(m.notes)}</p>`:''}${[m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).length?`<p class="muted small">${esc([m.charge!==null&&m.charge!==undefined?'Carica '+m.charge+' A':'',m.discharge!==null&&m.discharge!==undefined?'Scarica '+m.discharge+' A':'',m.voltage!==null&&m.voltage!==undefined?'Finale '+m.voltage+' V':'',m.duration!==null&&m.duration!==undefined?m.duration+' min':'',m.cycles!==null&&m.cycles!==undefined?m.cycles+' cicli':''].filter(Boolean).join(' · '))}</p>`:''}`).join('')||'<p class="muted">Nessuna misurazione.</p>'}</details><div class="actions"><button class="secondary" onclick="batteryMeasure='${c.id}';render()">+ Misurazione</button><button class="secondary" onclick="batteryEdit='${c.id}';render()">Modifica</button></div></div>`}).join(''):'<div class="empty">Aggiungi la prima batteria singola.</div>'}`}`}
const inventory15=inventory,assignPage15=assignPage,detail15=detail,render15=render;
inventory=function(){return inventoryKind==='battery'?batteryLab():inventory15()};
assignPage=function(){batteryInit();const c=data.cars.find(x=>x.id===inventoryCar);if(!c)return assignPage15();const motors=data.components.filter(x=>x.kind==='motor');const legacy=data.components.filter(x=>x.kind==='battery');const assigned=data.batteryPairs.find(x=>x.assignedCarId===c.id);return `<button class="secondary" onclick="inventoryCar=null;selected='${c.id}';page='garage';render()">← Garage</button><h2>Componenti di ${esc(c.name)}</h2><div class="section"><label>Motore</label><select id="assign-motor"><option value="">— Nessuno —</option>${motors.map(x=>`<option value="${x.id}" ${x.assignedCarId===c.id?'selected':''}>${esc(componentName(x))}</option>`).join('')}</select><label>Coppia batterie</label><select id="assign-pair"><option value="">— Nessuna —</option>${data.batteryPairs.map(p=>`<option value="${p.id}" ${p.assignedCarId===c.id?'selected':''}>${esc(batteryPairLabel(p))}</option>`).join('')}</select>${legacy.length?`<p class="muted">Le vecchie coppie restano conservate nell'archivio precedente. Per il nuovo Battery Lab crea due batterie singole e abbinale.</p>`:''}</div><button onclick="saveAssignments16('${c.id}')">Salva assegnazioni</button>`};
function saveAssignments16(cid){const c=data.cars.find(x=>x.id===cid),motorId=$('assign-motor').value,pairId=$('assign-pair').value,oldMotor=currentPart(cid,'motor'),oldPair=data.batteryPairs.find(x=>x.assignedCarId===cid);const changes=[];if((oldMotor?.id||'')!==motorId){if(oldMotor){oldMotor.assignedCarId=null;changes.push('Motore rimosso: '+componentName(oldMotor))}if(motorId){const m=data.components.find(x=>x.id===motorId);const prior=data.cars.find(x=>x.id===m.assignedCarId);if(prior)changes.push('Motore spostato da '+prior.name);m.assignedCarId=cid;changes.push('Motore montato: '+componentName(m))}}if((oldPair?.id||'')!==pairId){if(oldPair){oldPair.assignedCarId=null;changes.push('Coppia rimossa: '+batteryPairLabel(oldPair))}if(pairId){const p=data.batteryPairs.find(x=>x.id===pairId);const prior=data.cars.find(x=>x.id===p.assignedCarId);if(prior)changes.push('Coppia spostata da '+prior.name);p.assignedCarId=cid;changes.push('Coppia montata: '+batteryPairLabel(p))}}if(changes.length){data.events.unshift({id:id(),type:'work',carId:cid,carName:c.name,chassis:c.chassis,category:c.category,title:'Cambio componenti',date:today(),before:{...c.setup},after:{...c.setup},notes:changes.join(' | ')});persist()}inventoryCar=null;page='garage';selected=cid;render()}
detail=function(){const html=detail15();const c=car(),p=data.batteryPairs.find(x=>x.assignedCarId===c.id);return html.replace(/<div class="item"><span>Batterie<\/span><strong>.*?<\/strong><\/div>/,`<div class="item"><span>Batterie</span><strong>${p?esc(batteryPairLabel(p)):'—'}</strong></div>`)};
render=function(){batteryInit();render15()};
